<title>Threads 投稿メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: step 1-2 form beside the generated prompt (stacks on phones), step 3 post check below */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1d2129;
  --muted: #5c6472;
  --line: #dde1e8;
  --accent: #2f5bd3;
  --accent-soft: #e6ecfc;
  --band: #dbe5ff;
  --ok: #1f7a4a;
  --ok-bg: #e3f4ea;
  --warn: #8a5a00;
  --warn-bg: #fdf0d2;
  --ng: #b42318;
  --ng-bg: #fde4e1;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --surface: #1c2027; --fg: #e8ebf0; --muted: #a2a9b5; --line: #2f3540;
    --accent: #8aa8ff; --accent-soft: #222c45; --band: #263459;
    --ok: #6fd39c; --ok-bg: #173527; --warn: #f1c46b; --warn-bg: #3a2e14; --ng: #ff8f84; --ng-bg: #3f1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --surface: #1c2027; --fg: #e8ebf0; --muted: #a2a9b5; --line: #2f3540;
  --accent: #8aa8ff; --accent-soft: #222c45; --band: #263459;
  --ok: #6fd39c; --ok-bg: #173527; --warn: #f1c46b; --warn-bg: #3a2e14; --ng: #ff8f84; --ng-bg: #3f1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; }
header h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 820px) { .sticky { position: static; } }
.step { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; font-family: var(--font-display); font-size: 1.1rem; }
.step .no { font-family: var(--font-num); font-size: 0.8rem; color: var(--accent); }
.stack { display: grid; gap: 14px; }

.field label { display: block; font-weight: 700; font-size: 0.9rem; }
.field .hint { color: var(--muted); font-size: 0.8rem; font-weight: 400; margin-left: 4px; }
.field input, .field select, .field textarea, textarea.big {
  width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 16px;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.7; }
.cnt { display: flex; justify-content: flex-end; gap: 6px; font-size: 0.78rem; color: var(--muted); margin-top: 2px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.cnt.over { color: var(--warn); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 480px) { .two { grid-template-columns: minmax(0, 1fr); } }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .persona:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.personas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 480px) { .personas { grid-template-columns: minmax(0, 1fr); } }
.persona { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.persona:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.persona input { margin-top: 5px; }
.persona b { display: block; font-size: 0.92rem; }
.persona .lv { font-family: var(--font-num); font-size: 0.75rem; color: var(--accent); }
.persona small { display: block; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
.count-note { font-size: 0.85rem; color: var(--muted); margin: 8px 0 0; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.spacer { flex: 1; }
button { font: inherit; font-size: 0.9rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
textarea.big { min-height: 320px; font-size: 13px; line-height: 1.6; font-family: var(--font-body); resize: vertical; }
.note { font-size: 0.85rem; color: var(--muted); margin: 8px 0 0; }
.badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }

.check { margin-top: 20px; }
.check textarea { min-height: 200px; line-height: 1.8; }
.range { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.9rem; }
.range input { width: 4.5em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-family: var(--font-num); }
.count { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.count .num { font-family: var(--font-num); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ng { background: var(--ng-bg); color: var(--ng); }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin: 12px 0 4px; overflow: hidden; }
.meter .band { position: absolute; top: 0; bottom: 0; background: var(--band); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 5px; transition: width .15s; }
@media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
.scale { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 0.75rem; color: var(--muted); }
h3 { font-size: 0.85rem; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
ul.checks, ol.sentences, ul.words { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.checks .detail { color: var(--muted); font-size: 0.85rem; display: block; }
.sentences li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.sentences li:first-child { border-top: 0; }
.sentences .tag { font-size: 0.8rem; color: var(--muted); }
.sentences .txt { overflow-wrap: anywhere; }
.sentences .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.br { font-size: 0.75rem; color: var(--accent); margin-left: 4px; }
.words li { font-size: 0.9rem; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 0.9rem; }
</style>

<main class="wrap">
  <header>
    <h1>Threads 投稿メーカー</h1>
    <p>欄を埋めてクオリティを選ぶと、AIに貼るプロンプトができます。できた投稿は下の「仕上げチェック」で直します。</p>
  </header>

  <div class="grid">
    <section class="card stack" aria-labelledby="s1">
      <h2 class="step" id="s1"><span class="no">STEP 1</span>変数を書く <span class="badge" id="exampleBadge" hidden>例が入っています</span></h2>

      <div class="two">
        <div class="field">
          <label for="f-genre">ジャンル</label>
          <input id="f-genre" data-key="genre" data-soft="20" placeholder="例：家電・キッチン">
          <div class="cnt"></div>
        </div>
        <div class="field">
          <label for="f-tone">口調</label>
          <input id="f-tone" data-key="tone" data-soft="20" list="tones" placeholder="ペルソナに任せる">
          <datalist id="tones">
            <option value="ペルソナに任せる"></option>
            <option value="女子のタメ口"></option>
            <option value="お姉さん系"></option>
            <option value="オタク系"></option>
            <option value="丁寧系"></option>
          </datalist>
          <div class="cnt"></div>
        </div>
      </div>

      <div class="field">
        <label for="f-target">ターゲット<span class="hint">具体的な悩みを抱えた層</span></label>
        <input id="f-target" data-key="target" data-soft="40" placeholder="例：毎朝のコーヒー代がかさむ30代の共働き">
        <div class="cnt"></div>
      </div>

      <div class="field">
        <label for="f-product">紹介したい商品・サービス<span class="hint">なければ「カテゴリのみ」</span></label>
        <input id="f-product" data-key="product" data-soft="40" placeholder="例：〇〇 全自動コーヒーメーカー">
        <div class="cnt"></div>
      </div>

      <div class="field">
        <label for="f-info">商品情報<span class="hint">価格・特徴など公式に書かれた事実だけ。画像を貼るなら「画像参照」</span></label>
        <textarea id="f-info" data-key="info" data-soft="400" placeholder="例：価格12,800円（税込）。ボタン1つで豆挽きから抽出まで。"></textarea>
        <div class="cnt"></div>
      </div>

      <div class="two">
        <div class="field">
          <label for="f-exp">取扱経験</label>
          <select id="f-exp" data-key="exp">
            <option>不明</option><option>なし</option><option>あり</option>
          </select>
        </div>
        <div class="field">
          <label for="f-a8">A8提携状況</label>
          <select id="f-a8" data-key="a8">
            <option>承認済み</option><option>申請中</option><option>未申請</option>
          </select>
        </div>
      </div>

      <div class="field" id="expDetailWrap">
        <label for="f-expdetail">経験の内容<span class="hint">「あり」の時だけ。書いた範囲でしか体験を語りません</span></label>
        <textarea id="f-expdetail" data-key="expdetail" data-soft="200" placeholder="例：3ヶ月毎朝使用。洗う手間は1分くらい。"></textarea>
        <div class="cnt"></div>
      </div>

      <div class="two">
        <div class="field">
          <label for="f-pr">PR表記</label>
          <input id="f-pr" data-key="pr" data-soft="8" placeholder="【PR】">
          <div class="cnt"></div>
        </div>
        <div class="field">
          <label for="f-ng">広告主の禁止事項</label>
          <input id="f-ng" data-key="ng" data-soft="200" placeholder="特になし">
          <div class="cnt"></div>
        </div>
      </div>

      <h2 class="step" id="s2"><span class="no">STEP 2</span>クオリティを選ぶ</h2>
      <div class="personas" id="personas" role="group" aria-labelledby="s2"></div>
      <p class="count-note" id="countNote"></p>

      <div class="row">
        <span class="spacer"></span>
        <button type="button" id="resetBtn">欄を空にする</button>
        <button type="button" id="exampleBtn">例を入れる</button>
      </div>
    </section>

    <section class="card sticky" aria-labelledby="s3">
      <h2 class="step" id="s3"><span class="no">STEP 3</span>プロンプトをコピー</h2>
      <label for="prompt" class="note" style="margin:0">AIに貼るプロンプト（画像があれば一緒に貼る）</label>
      <textarea id="prompt" class="big" readonly></textarea>
      <div class="cnt" id="promptCnt"></div>
      <div class="row">
        <span class="note" id="warnA8" style="margin:0"></span>
        <span class="spacer"></span>
        <button type="button" class="primary" id="copyPrompt">プロンプトをコピー</button>
      </div>
    </section>
  </div>

  <section class="card check" aria-labelledby="s4">
    <h2 class="step" id="s4"><span class="no">STEP 4</span>仕上げチェック</h2>
    <div class="grid" style="margin-top:0">
      <div>
        <label for="post" class="note" style="margin:0">AIが書いた投稿から1つ選んで貼り、手で直す</label>
        <textarea id="post" class="big" spellcheck="false" placeholder="ここに投稿を貼り付け"></textarea>
        <div class="row">
          <span class="range">
            <label for="min">目標</label><input id="min" type="number" inputmode="numeric" value="160" min="0">
            〜<input id="max" type="number" inputmode="numeric" value="200" min="1" aria-label="上限">文字
          </span>
          <span class="spacer"></span>
          <button id="sampleBtn" type="button">例文</button>
          <button id="clearBtn" type="button">消す</button>
          <button id="copyBtn" type="button" class="primary">コピー</button>
        </div>
        <p class="note" id="sampleNote" hidden><span class="badge">例文</span> あなたの投稿に置き換えてください。</p>
        <p class="note">数え方：絵文字・記号・スペース・改行もすべて1文字。Threadsの上限は500文字です。</p>
      </div>

      <div aria-live="polite">
        <div class="count">
          <span class="num" id="total">0</span><span>文字</span>
          <span class="pill" id="status"></span>
        </div>
        <div class="meter" aria-hidden="true"><div class="band" id="band"></div><div class="fill" id="fill"></div></div>
        <div class="scale"><span>0</span><span id="scaleMax"></span></div>
        <p class="note" id="sub"></p>
        <h3>チェック</h3>
        <ul class="checks" id="checks"></ul>
        <h3>1文ごとの文字数</h3>
        <ol class="sentences" id="sentences"></ol>
        <h3>注意したい言葉</h3>
        <ul class="words" id="words"></ul>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter("ja", { granularity: "grapheme" }) : null;
  function graphemes(s) { return seg ? Array.from(seg.segment(s), function (x) { return x.segment; }) : Array.from(s); }
  function len(s) { return graphemes(s).length; }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ---------- STEP 1-3: prompt builder ---------- */
  var PERSONAS = [
    { lv: 1, name: "おしゃべり上手な主婦「さとみさん」", short: "主婦「さとみさん」",
      tone: "近所のママ友に話すようなやわらかいタメ口（「〜なのよ」「〜じゃない？」）",
      skill: "生活の一場面で共感を取るのが得意。数字は1つでシンプルに。",
      card: "やわらかいタメ口。生活の場面で共感を取る" },
    { lv: 2, name: "販売歴10年の店頭スタッフ「みゆきさん」", short: "店頭スタッフ「みゆきさん」",
      tone: "親しみのある丁寧語まじり（「〜なんです」「〜ですよ」）",
      skill: "使う場面を具体的に描き、読み手が気にしそうなこと（手間・値段）を先回りして書く。",
      card: "丁寧語まじり。使う場面と手間・値段を先回り" },
    { lv: 3, name: "トップセールス「神崎 誠」", short: "トップセールス「神崎 誠」",
      tone: "落ち着いた語りかけ（「〜した方がいい」「〜じゃないですか？」）",
      skill: "ターゲットの悩みを一番正確な言葉で言い当てる。フックの精度が最も高い。",
      card: "落ち着いた語り。悩みを一番正確に言い当てる" },
    { lv: 4, name: "セールス×コピーライティング監修「一ノ瀬 玲」", short: "コピー監修「一ノ瀬 玲」",
      tone: "短く歯切れのいいタメ口",
      skill: "1文目を最短にし、全文のリズムと語尾を磨き込む。4つの文それぞれの役割を最大まで強める。",
      card: "歯切れのいいタメ口。言葉とリズムを磨き込む" }
  ];
  var FIELDS = ["genre", "tone", "target", "product", "info", "exp", "expdetail", "a8", "pr", "ng"];
  var EXAMPLE = {
    genre: "家電・キッチン", tone: "ペルソナに任せる", target: "毎朝のコーヒー代がかさむ30代の共働き",
    product: "全自動コーヒーメーカー（例）", info: "価格12,800円（税込）。ボタン1つで豆挽きから抽出まで。（例：ここに公式サイトの記載を貼る）",
    exp: "不明", expdetail: "", a8: "承認済み", pr: "【PR】", ng: "特になし"
  };
  var PLACEHOLDER = {
    genre: "{ジャンル}", tone: "ペルソナに任せる", target: "{ターゲット（具体的な悩みを抱えた層）}",
    product: "{商品名／なければ「カテゴリのみ」と記載}", info: "{価格・特徴など公式に書かれた事実}",
    exp: "不明", expdetail: "", a8: "承認済み", pr: "【PR】", ng: "特になし"
  };

  var personaBox = $("personas");
  personaBox.innerHTML = PERSONAS.map(function (p) {
    return '<label class="persona"><input type="checkbox" id="lv' + p.lv + '" value="' + p.lv + '" checked>' +
      '<span><span class="lv">Lv' + p.lv + '</span><b>' + esc(p.short) + '</b><small>' + esc(p.card) + "</small></span></label>";
  }).join("");

  function el(key) { return document.querySelector('[data-key="' + key + '"]'); }
  function val(key) { var v = el(key).value.trim(); return v || PLACEHOLDER[key]; }
  function selected() { return PERSONAS.filter(function (p) { return $("lv" + p.lv).checked; }); }

  function buildPrompt() {
    var ps = selected();
    var pr = val("pr");
    var exp = val("exp") + (val("exp") === "あり" && el("expdetail").value.trim() ? "（内容：" + el("expdetail").value.trim() + "）" : "");
    var team = ps.map(function (p) {
      return "### Lv" + p.lv + "：" + p.name + "\n- 口調：" + p.tone + "\n- 技術：" + p.skill;
    }).join("\n\n");
    var blocks = ps.map(function (p, i) {
      var first = i === 0;
      return "■ Lv" + p.lv + " " + p.short + "\n\n" +
        (first
          ? "【パターンA｜価格ギャップ重視型】\n伸びる確率（AI自己採点）：〇〇％\n文字数（概算）：〇〇字\n\n（本文）\n\n採点内訳：\n・フック力：〇/20\n・具体性：〇/20\n・逆張り強度：〇/20\n・共感性：〇/20\n・コメント誘発力：〇/20\nコンプラチェック：PR表記 ○／NG表現なし ○／体験談ルール ○\n\n【パターンB｜時短・手軽さ重視型】\n（同じ形式）\n\n【パターンC｜逆張り・共感重視型】\n（同じ形式）"
          : "（同じ形式でパターンA〜C）");
    }).join("\n━━━━━━━━━━━━━━━\n");

    return [
      "# Threads バズ投稿生成プロンプト（悩み解決・商品紹介型／1行目のみ改行パターン／" + ps.length + "人×3案出し／A8.net・PR表記対応）",
      "",
      "## 役割",
      "あなたはThreadsで30,000表示以上を獲得する投稿を量産するSNSライターチームです。",
      "下の" + ps.length + "人のメンバーが、同じ商品について、それぞれ3パターンずつ投稿を作ります。",
      "",
      "変数から「ビフォー状態」「アフター状態」「競合の選択肢」「ハードルの低さ（価格・手軽さ）」を考えて投稿を作成してください。",
      "ただし推測してよいのは読み手の状況（悩み・今の選択肢・理想の状態）だけです。",
      "商品の価格・時間・効果・実績などの数字は、変数「商品情報」に書かれたものだけを使ってください。書かれていない数字は作らず、【要確認：価格】のように空欄で残してください。",
      "画像が貼られている場合は、画像からはっきり読み取れる事実（パッケージの文字など）だけを使い、推測はしないでください。",
      "",
      "## メンバー（クオリティ）",
      "メンバーの違いは「書く技術のレベル」です。変数「口調」が「ペルソナに任せる」なら各自の口調で、それ以外ならその口調に統一して書きます。",
      "メンバーの経歴や体験を事実として書いてはいけません（変数「取扱経験」が「あり」の場合を除く）。",
      "",
      team,
      "",
      "## 改行ルール（最重要・厳守）",
      "- 1文目の後にのみ改行を入れる",
      "- 2文目以降は改行せず、1つの段落として続けて書く",
      "- 句点（。）で文を区切るが、改行はしない",
      "",
      "【正しい形式の例】",
      pr + "1文目（フック）。",
      "2文目だって、〜🥹3文目〜試して。4文目〜良くない？🥹",
      "",
      "## PR表記ルール（ステマ規制・厳守）",
      "- アフィリエイト（A8.net）の紹介なので、この投稿は広告です。2023年10月からステマ規制の対象です。",
      "- 本文の先頭に「" + pr + "」を必ず入れます。この表記も文字数に含めます。",
      "- 「友達がLINEで教えてくれた感」は口調の話です。広告であることを隠す意味ではありません。PR表記を消したり、目立たない位置に移したりしないでください。",
      "- 第三者の中立な口コミのように見せる書き方（「たまたま見つけた」「宣伝じゃないけど」など）は禁止です。",
      "",
      "## A8.net 利用時のルール",
      "- 変数「A8提携状況」が「承認済み」でない場合は、投稿の前に「提携承認を先に取ってください」と1行で伝えます。",
      "- 変数「広告主の禁止事項」に書かれた表現は絶対に使いません。",
      "- アフィリエイトリンクは本文に入れず、ツリー（自分への返信）投稿用の文を別に作ります。ツリー投稿にもPR表記を入れます。",
      "",
      "## 表現のNGルール（厳守）",
      "次の表現は、採点がどれだけ上がっても使いません。",
      "1. 作った数字・実績：入力にない価格・時間・効果・販売数・ランキング・満足度。",
      "2. 根拠のない最上級：「No.1」「日本一」「最安」「最高」は、変数「商品情報」に出典があるときだけ使えます。",
      "3. 効果の保証：「絶対痩せる」「必ず効く」「100%」「誰でも」。※「絶対試して」のような呼びかけは使えますが、商品の効果を保証する使い方は禁止です。",
      "4. 薬機法・健康増進法：化粧品・健康食品・サプリで「治る」「痩せる」「シミが消える」「若返る」「免疫力アップ」など。",
      "5. 他社・他商品の悪口：3文目では商品名やブランド名を出さず「高い〇〇」「手間のかかる〇〇」のようなカテゴリで書きます。「〇〇より効く」のような比較の断定はしません。",
      "6. 作った体験談：変数「取扱経験」が「なし」「不明」のときは「使ってみたら」「愛用してる」「私も〜だった」と書きません。「〜できるらしい」「〜できるやつ」のように紹介として書きます。「あり」のときも、書かれた内容の範囲でだけ語ります。",
      "7. うその限定・煽り：「今だけ」「残りわずか」は、変数「商品情報」で事実と確認できるときだけ使います。",
      "",
      "## 構成ルール（厳守）",
      "合計160〜200文字以内（PR表記・絵文字・改行も含めて1文字ずつ数える）。",
      "",
      "【1文目｜悩み特定フック】※この後だけ改行",
      "「" + pr + "（ターゲットの悩み）に悩んでる人、（商品/カテゴリ）使った方がいい。」",
      "→ 当事者が1秒で「自分のことだ」と気づく断定文。",
      "",
      "【2文目｜ギャップ提示】※改行せず続ける",
      "「だって、（価格や手軽さなどのハードルの低さ）なのに（得られる嬉しい結果）🥹」",
      "→ コスト < 効果のギャップで驚きを作る。数字は「商品情報」にあるものだけを使う。",
      "",
      "【3文目｜逆張りで名指し】※改行せず続ける",
      "「（高価格帯・手間のかかる既存の選択肢）使ってて（悩み状態）な人、試してみて。」",
      "→ 既存の選択肢を使っている層に呼びかけ、保存・コメントを誘発する。選択肢そのものを悪く言わない。",
      "",
      "【4文目｜共感問いかけ】※改行せず続ける、ここで投稿終了",
      "「（手間のかかる現状）より（この商品で得られる楽な未来）方が良くない？🥹」",
      "→ 疑問形で締めてコメント欄に「確かに」を集める。",
      "",
      "## 3パターン作成ルール",
      "各メンバーが、以下3つの異なる切り口で投稿を作成してください。それぞれ別の角度から刺すこと。",
      "",
      "【パターンA｜価格ギャップ重視型】→「手頃なのに満足感が高い」のコスパ訴求を強める",
      "【パターンB｜時短・手軽さ重視型】→「時間・手間が減る」の効率訴求を強める",
      "【パターンC｜逆張り・共感重視型】→「高い物を使ってる人ほど気づいてない」の意外性訴求を強める",
      "",
      "## 伸びる確率の算出ルール",
      "各パターンに「伸びる確率（AI自己採点）」を付けてください。以下5項目を各20点で採点し、合計100点満点を％で表示します。",
      "※実際の表示回数の予測ではなく、どの案を選ぶかの目安です。",
      "1. フック力（1文目で当事者を引き込めるか）",
      "2. 具体性（数字・固有名詞で得感が伝わるか）",
      "3. 逆張り強度（既存の選択肢を使っている層に呼びかけられているか）",
      "4. 共感性（ターゲットの本音に刺さるか）",
      "5. コメント誘発力（疑問形・反論したくなる要素があるか）",
      "採点外で「コンプラチェック」も行います。PR表記・NGルール・取扱経験ルールのどれか1つでも×なら、書き直してから出力してください。",
      "",
      "## トーン指示",
      "- 口調は「" + val("tone") + "」を厳守（「ペルソナに任せる」なら各メンバーの口調）",
      "- 友達がLINEで教えてくれた感を出す（売り込み口調はNG。ただしPR表記は必須）",
      "- 絵文字は🥹を中心に2回まで",
      "- 体言止め・口語OK、専門用語NG",
      "- 具体的な数字（価格・時間など）を必ず1つ以上入れる。「商品情報」に数字がない場合は【要確認：〇〇】と書く",
      "",
      "## 出力形式",
      "以下のフォーマットで出力してください（解説・前置き不要）。",
      "",
      "━━━━━━━━━━━━━━━",
      blocks,
      "━━━━━━━━━━━━━━━",
      "",
      "【リンク用ツリー投稿】（本文への自分の返信として投稿）",
      pr + "（商品名）はここから見られるよ👇",
      "（A8.netのリンクを貼る）",
      "",
      "【総合おすすめ】",
      "最も伸びる確率が高い案：Lv〇 パターン〇",
      "理由：（30文字以内で簡潔に）",
      "",
      "【要確認リスト】",
      "・（【要確認：〇〇】にした項目や、出典が必要な表現など。なければ「なし」）",
      "",
      "## 変数",
      "- ジャンル：" + val("genre"),
      "- ターゲット：" + val("target"),
      "- 紹介したい商品・サービス：" + val("product"),
      "- 口調：" + val("tone"),
      "- 商品情報：" + val("info"),
      "- 取扱経験：" + exp,
      "- ASP：A8.net",
      "- A8提携状況：" + val("a8"),
      "- 広告主の禁止事項：" + val("ng"),
      "- PR表記：" + pr
    ].join("\n");
  }

  function updateCounters() {
    document.querySelectorAll(".field").forEach(function (f) {
      var input = f.querySelector("[data-key]"), cnt = f.querySelector(".cnt");
      if (!input || !cnt) return;
      var n = len(input.value), soft = parseInt(input.dataset.soft, 10);
      cnt.textContent = n + "字" + (soft ? " ／ 目安" + soft + "字" : "");
      cnt.classList.toggle("over", !!soft && n > soft);
    });
  }

  function renderBuilder() {
    var ps = selected();
    if (!ps.length) { $("lv3").checked = true; ps = selected(); }
    $("expDetailWrap").hidden = el("exp").value !== "あり";
    updateCounters();
    var p = buildPrompt();
    $("prompt").value = p;
    $("promptCnt").textContent = "プロンプト " + len(p) + "字";
    $("countNote").textContent = ps.length + "人 × 3案 ＝ " + ps.length * 3 + "案が出ます。" + (ps.length === 4 ? "読むのが大変なら2人くらいに絞るのもおすすめです。" : "");
    $("warnA8").textContent = el("a8").value !== "承認済み" ? "A8.netの提携承認を先に取ってください" : "";
    var isExample = FIELDS.every(function (k) { return el(k).value === EXAMPLE[k]; });
    $("exampleBadge").hidden = !isExample;
    var saved = {};
    FIELDS.forEach(function (k) { saved[k] = el(k).value; });
    saved.lv = ps.map(function (x) { return x.lv; });
    store.set("threads-maker-form", JSON.stringify(saved));
  }

  function fill(obj) {
    FIELDS.forEach(function (k) { el(k).value = obj[k] != null ? obj[k] : (el(k).tagName === "SELECT" ? el(k).options[0].value : ""); });
    if (obj.lv) PERSONAS.forEach(function (p) { $("lv" + p.lv).checked = obj.lv.indexOf(p.lv) >= 0; });
  }

  var savedForm = null;
  try { savedForm = JSON.parse(store.get("threads-maker-form") || "null"); } catch (e) {}
  fill(savedForm || EXAMPLE);

  document.querySelectorAll("[data-key], .persona input").forEach(function (x) {
    x.addEventListener("input", renderBuilder);
    x.addEventListener("change", renderBuilder);
  });
  $("exampleBtn").addEventListener("click", function () { fill(EXAMPLE); renderBuilder(); });
  $("resetBtn").addEventListener("click", function () {
    fill({ exp: "不明", a8: "承認済み", pr: "【PR】", lv: [1, 2, 3, 4] }); renderBuilder(); el("genre").focus();
  });

  function copyText(btn, text, label, textarea) {
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = label; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done("コピーしました"); }, function () { textarea.select(); done("選択しました"); });
    } else { textarea.select(); done("選択しました"); }
  }
  $("copyPrompt").addEventListener("click", function () { copyText(this, $("prompt").value, "プロンプトをコピー", $("prompt")); });
  renderBuilder();

  /* ---------- STEP 4: post check ---------- */
  var SAMPLE = "【PR】朝のコーヒー淹れるのが面倒な人、全自動コーヒーメーカー使った方がいい。\nだって、ボタン1つで豆を挽くところから全部やってくれるのに、淹れたての香りで飲めるの🥹毎朝カフェに寄ってて出費が気になってる人、絶対試して。毎朝お店に並ぶより、家でゆっくり淹れたての一杯飲める方が良くない？🥹";
  var LABELS4 = ["フック", "ギャップ", "逆張り", "問いかけ"];
  var END = "。！？!?";
  var EMOJI = /\p{Extended_Pictographic}/u;
  var PR = /【PR】|[#＃]PR|(^|[^A-Za-z])PR([^A-Za-z]|$)|広告|プロモーション/i;
  var WORDS = [
    { re: /治る|治す|治療|完治/g, level: "ng", why: "薬機法：病気を治すような表現" },
    { re: /痩せ|やせる|脂肪(が|を)?(燃|落)/g, level: "ng", why: "薬機法・健康増進法：痩身効果の表現" },
    { re: /シミが消え|シワが消え|若返/g, level: "ng", why: "薬機法：化粧品の効能を超える表現" },
    { re: /免疫力/g, level: "ng", why: "健康増進法：身体機能の改善をうたう表現" },
    { re: /元本保証|必ず儲か|絶対儲か/g, level: "ng", why: "金融商品の断定表現" },
    { re: /【要確認/g, level: "ng", why: "空欄のまま。商品情報で埋めてください" },
    { re: /宣伝じゃない|案件じゃない|たまたま見つけ/g, level: "ng", why: "ステマ：広告を中立な口コミに見せる表現" },
    { re: /100[%％]|１００[%％]/g, level: "warn", why: "効果の保証に読めないか確認" },
    { re: /絶対|必ず/g, level: "warn", why: "呼びかけならOK。効果の保証ならNG" },
    { re: /誰でも|完全|永久/g, level: "warn", why: "断定しすぎていないか確認" },
    { re: /No\.?1|ナンバーワン|日本一|世界一|業界初/gi, level: "warn", why: "出典と調査条件がある時だけ使える" },
    { re: /最安|最高品質|最強/g, level: "warn", why: "根拠がある時だけ使える" },
    { re: /今だけ|残りわずか|本日限り|期間限定/g, level: "warn", why: "事実の時だけ使える" }
  ];
  function isEnd(c) { return c !== undefined && (END.indexOf(c) >= 0 || EMOJI.test(c)); }
  function splitSentences(g) {
    var out = [], cur = "";
    for (var i = 0; i < g.length; i++) {
      var c = g[i];
      if (c === "\n") {
        if (cur.trim()) out.push({ text: cur, br: true });
        else if (out.length) out[out.length - 1].br = true;
        cur = "";
        continue;
      }
      cur += c;
      if (isEnd(c) && !isEnd(g[i + 1])) { out.push({ text: cur, br: false }); cur = ""; }
    }
    if (cur.trim()) out.push({ text: cur, br: false });
    return out;
  }
  function mark(level) { return level === "ok" ? "○" : level === "warn" ? "△" : "×"; }

  var post = $("post"), minEl = $("min"), maxEl = $("max");
  function renderCheck() {
    var body = post.value.replace(/\r\n?/g, "\n").replace(/\n+$/, "");
    var g = graphemes(body);
    var total = g.length;
    var noBreak = g.filter(function (c) { return c !== "\n"; }).length;
    var min = parseInt(minEl.value, 10) || 0;
    var max = Math.max(parseInt(maxEl.value, 10) || 1, min + 1);

    $("total").textContent = total;
    var st = $("status");
    if (total === 0) { st.className = "pill"; st.textContent = ""; }
    else if (total < min) { st.className = "pill warn"; st.textContent = "あと" + (min - total) + "文字"; }
    else if (total > max) { st.className = "pill ng"; st.textContent = (total - max) + "文字オーバー"; }
    else { st.className = "pill ok"; st.textContent = "ちょうどいい"; }

    var scale = Math.max(Math.round(max * 1.25), total);
    $("band").style.left = (min / scale * 100) + "%";
    $("band").style.width = ((max - min) / scale * 100) + "%";
    $("fill").style.width = Math.min(total / scale * 100, 100) + "%";
    $("scaleMax").textContent = scale;
    $("sub").textContent = "改行を除くと " + noBreak + " 文字 ／ Threads上限まで残り " + (500 - total) + " 文字";

    var sentences = splitSentences(g);
    var breaks = g.filter(function (c) { return c === "\n"; }).length;
    var emojis = g.filter(function (c) { return EMOJI.test(c); }).length;
    var checks = [];
    checks.push({ level: total === 0 ? "warn" : (total >= min && total <= max ? "ok" : "ng"), label: "文字数 " + min + "〜" + max, detail: total + "文字" });
    var brOk = breaks === 1 && sentences.length > 1 && sentences[0].br;
    checks.push({ level: brOk ? "ok" : "ng", label: "改行は1文目の後だけ",
      detail: brOk ? "OK" : (breaks === 0 ? "改行がありません" : breaks > 1 ? "改行が" + breaks + "回あります（1回だけにする）" : "改行の位置が1文目の後ではありません") });
    var hasPR = PR.test(body);
    checks.push({ level: hasPR ? "ok" : "ng", label: "PR表記",
      detail: hasPR ? (PR.test(g.slice(0, 15).join("")) ? "先頭にあります" : "あります（先頭に置くと分かりやすい）") : "【PR】などを入れてください（ステマ規制）" });
    checks.push({ level: emojis <= 2 ? "ok" : "ng", label: "絵文字2回まで", detail: emojis + "回" });
    var hasNum = /[0-9０-９]|[一二三四五六七八九十百千万]+(円|分|秒|日|回|個|枚|本|袋|杯|週間|ヶ月|か月)/.test(body);
    checks.push({ level: hasNum ? "ok" : "warn", label: "数字が1つ以上", detail: hasNum ? "あり" : "価格・時間などの数字を入れる" });
    checks.push({ level: sentences.length === 4 ? "ok" : "warn", label: "4文構成", detail: sentences.length + "文" });
    $("checks").innerHTML = checks.map(function (c) {
      return '<li><span class="pill ' + c.level + '">' + mark(c.level) + '</span><span>' + esc(c.label) + '<span class="detail">' + esc(c.detail) + "</span></span></li>";
    }).join("");

    $("sentences").innerHTML = sentences.length ? sentences.map(function (s, i) {
      var tag = sentences.length === 4 ? (i + 1) + " " + LABELS4[i] : (i + 1) + "文目";
      return '<li><span class="tag">' + tag + '</span><span class="txt">' + esc(s.text) + (s.br ? '<span class="br">↵改行</span>' : "") +
        '</span><span class="n">' + len(s.text) + "</span></li>";
    }).join("") : '<li class="empty">まだ文がありません</li>';

    var hits = [];
    WORDS.forEach(function (w) {
      var m = body.match(w.re);
      if (m) hits.push({ level: w.level, word: Array.from(new Set(m)).join("・"), why: w.why });
    });
    hits.sort(function (a, b) { return a.level === b.level ? 0 : a.level === "ng" ? -1 : 1; });
    $("words").innerHTML = hits.length ? hits.map(function (h) {
      return '<li><span class="pill ' + h.level + '">' + (h.level === "ng" ? "NG候補" : "要確認") + "</span> 「" + esc(h.word) + "」 " + esc(h.why) + "</li>";
    }).join("") : '<li class="empty">見つかりませんでした（最終確認は人の目で）</li>';

    $("sampleNote").hidden = post.value !== SAMPLE;
    store.set("threads-counter-draft", post.value);
  }

  var savedPost = store.get("threads-counter-draft");
  post.value = savedPost ? savedPost : SAMPLE;
  post.addEventListener("input", renderCheck);
  minEl.addEventListener("input", renderCheck);
  maxEl.addEventListener("input", renderCheck);
  $("sampleBtn").addEventListener("click", function () { post.value = SAMPLE; renderCheck(); post.focus(); });
  $("clearBtn").addEventListener("click", function () { post.value = ""; renderCheck(); post.focus(); });
  $("copyBtn").addEventListener("click", function () { copyText(this, post.value, "コピー", post); });
  renderCheck();
})();
</script>
