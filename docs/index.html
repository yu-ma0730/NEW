<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>軍師プロフィール帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: home = AI接続 → 媒体カード → マーケティング開始（最下部）. 媒体ページ = スクショ取込 → 項目 → 段階チェック. 結果 = 5本の戦略プレゼン＋採点. Indigo ink (藍) on cool paper. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #5d6576;
  --line: #d9dde6;
  --accent: #2b4c7e;
  --accent-soft: #e3e9f4;
  --accent-ink: #ffffff;
  --gold: #9a6b12;
  --gold-soft: #f6ecd6;
  --warn-bg: #fbf1dc;
  --good: #2f6b4f;
  --bad: #a3362b;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --surface: #1a2030; --ink: #e6e9f0; --muted: #9aa3b5; --line: #2c3447;
    --accent: #8fb0e3; --accent-soft: #24304a; --accent-ink: #0f1420; --gold: #e0b45e; --gold-soft: #3a3020; --warn-bg: #3a3020; --good: #7cc3a0; --bad: #e88c80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --surface: #1a2030; --ink: #e6e9f0; --muted: #9aa3b5; --line: #2c3447;
  --accent: #8fb0e3; --accent-soft: #24304a; --accent-ink: #0f1420; --gold: #e0b45e; --gold-soft: #3a3020; --warn-bg: #3a3020; --good: #7cc3a0; --bad: #e88c80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.85rem; margin: 0; letter-spacing: .04em; text-wrap: balance; }
h3 { margin: 0; font-size: 1rem; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
.note { background: var(--warn-bg); border-radius: 8px; padding: 10px 14px; font-size: .88rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tile { text-align: left; display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
.tile .tg { color: var(--muted); font-size: .85rem; line-height: 1.55; }
.badge { justify-self: start; font-size: .75rem; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.badge.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.sub { background: var(--accent-soft); border-color: transparent; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px; display: grid; gap: 14px; min-width: 0; }
section.card > *, .strat > *, .sub > * { min-width: 0; }
section.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-wrap: balance; }
.hint { color: var(--muted); font-size: .85rem; margin: -6px 0 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > .label { font-weight: 700; font-size: .92rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ai-tag { font-size: .7rem; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; background: var(--bg); user-select: none; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .w { color: var(--gold); font-size: .78rem; margin-left: 4px; }
.chip input:checked + span .w { color: inherit; }
.chips.stage .chip span { border-style: dashed; }
input[type=text], input[type=number], input[type=url], input[type=password], input[type=date], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
textarea { min-height: 84px; resize: vertical; }
textarea.big { min-height: 200px; font-size: .9rem; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, label.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0,1fr) 10rem; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sub { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.sub-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.ghost { background: transparent; }
button.small { padding: 4px 10px; font-size: .85rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.status { font-size: .88rem; color: var(--muted); }
.status.ok { color: var(--good); } .status.ng { color: var(--bad); }
/* screenshot intake */
label.drop { display: grid; place-items: center; gap: 4px; text-align: center; border: 2px dashed var(--line); border-radius: 10px; padding: 18px 12px; cursor: pointer; background: var(--bg); color: var(--muted); font-size: .9rem; }
label.drop b { color: var(--ink); }
label.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); display: grid; min-width: 0; }
.shot .pic { position: relative; }
.shot img { display: block; width: 100%; max-height: 260px; object-fit: cover; object-position: top; }
.shot .stamp { position: absolute; top: 8px; left: 8px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.shot .stamp.done { background: var(--good); color: var(--surface); border-color: var(--good); }
.shot .reads { padding: 10px; display: grid; gap: 4px; font-size: .82rem; }
.shot .reads div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); }
.shot .reads span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.shot .foot { padding: 6px 10px 10px; display: flex; justify-content: flex-end; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.calc div { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.calc b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.calc small { color: var(--muted); }
.reading { font-size: .92rem; border-left: 3px solid var(--gold); padding-left: 10px; margin: 0; }
.facts { margin: 0; padding-left: 1.2em; font-size: .9rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: .85rem; width: 100%; }
.checklist .ok { color: var(--good); } .checklist .ng { color: var(--bad); } .checklist .warn { color: var(--gold); }
.checklist .sub { padding-left: 1.4em; font-size: .8rem; }
pre.out { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: .8rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
/* launch */
.launch { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 22px 18px; display: grid; gap: 12px; }
.launch h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; }
.launch p { margin: 0; opacity: .85; font-size: .9rem; }
.launch button.go { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 800; font-size: 1.1rem; padding: 14px 18px; }
.launch .status { color: inherit; opacity: .85; }
/* results */
.scorebox { overflow-x: auto; }
table.score { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .88rem; }
table.score th, table.score td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score td.total { font-weight: 800; font-size: 1.05rem; color: var(--accent); }
table.score tr.best td { background: var(--gold-soft); }
.strat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; display: grid; gap: 14px; min-width: 0; }
.strat.best { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.strat-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: start; }
.strat-head .no { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
.strat-head h3 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; text-wrap: balance; }
.strat-head .catch { color: var(--muted); margin: 2px 0 0; }
.big-score { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big-score b { font-size: 2.2rem; font-family: var(--font-display); color: var(--accent); }
.big-score small { display: block; color: var(--muted); font-size: .78rem; }
.pill-best { display: inline-block; font-size: .72rem; font-weight: 700; background: var(--gold); color: #fff; border-radius: 999px; padding: 1px 10px; margin-bottom: 4px; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 9.5rem minmax(0,1fr) 3rem; gap: 8px; align-items: center; font-size: .85rem; }
.bar-row .track { display: block; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-row .fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.bar-why { grid-column: 2 / 4; color: var(--muted); font-size: .78rem; margin-top: -4px; }
.kv { display: grid; gap: 10px; }
.kv > div { display: grid; gap: 2px; }
.kv dt { font-size: .78rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.first { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-weight: 700; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .9rem; max-width: calc(100% - 32px); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
</style>

const LINK_RE = /(https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+|【案件リンク】)/g;
function xWeight(t) {
  let w = 0;
  const rest = t.replace(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/g, () => { w += 23; return ""; });
  for (const ch of rest) { const c = ch.codePointAt(0); w += (c <= 0x10FF || (c >= 0x2000 && c <= 0x200D) || (c >= 0x2010 && c <= 0x201F) || (c >= 0x2032 && c <= 0x2037)) ? 1 : 2; }
  return w;
}

async function checkProof(id) {
  const pr = (S._proofs || []).find(x => x.id === id); if (!pr) return;
  const scope = "proof-" + id, shots = (SHOTS[scope] || []).slice(-6), st = $("#proofStatus-" + id), btn = document.querySelector(`[data-proofcheck="${id}"]`);
  const prompt = `あなたはアフィリエイト記事の「体験の表記」が本当かを確認するアシスタントです。ユーザーは「${pr.name}」を実際に使っていると言っています。
添付の${shots.length}枚の画像が、本人がこの商品・サービスを実際に購入・契約・利用していることを示しているか確認してください。

# 判定の基準
- ok を true にするのは、画像から「${pr.name}」を本人が購入・契約・利用していると読み取れる場合だけ（例：本人の手元や部屋にある商品の写真、契約・購入の完了画面、マイページ、購入履歴、利用中のアプリ画面）
- 公式サイトの宣伝画像・商品ページだけ・他人の写真・商品名が分からない画像は ok を false にする
- 本人かどうかを完全に確かめることはできないので、画像から読み取れる範囲で判定する
- 画像から読み取れる事実（プラン名・契約日・購入日・月額・使用期間など）を facts に入れる。推測はしない
- 画像に写っている個人情報（氏名・住所・電話番号・メールアドレス・注文番号・会員ID・顔など）を privacy に挙げる

# 本人のメモ
いつから：${v(`_pm.${id}.since`)}／良かった点：${v(`_pm.${id}.good`)}／不満な点：${v(`_pm.${id}.bad`)}

# 返す形式（この JSON だけ）
{ "ok": true, "kinds": ["商品写真・契約画面・購入履歴・利用画面・その他 のどれか"], "facts": ["読み取れた事実"], "privacy": ["写っている個人情報"], "reason": "判定の理由（1文）" }`;
  btn.disabled = true; st.className = "status"; st.textContent = "確認しています…（10〜40秒ほど）";
  try {
    const out = await askAI(prompt, { images: shots.map(x => dataUrlToBlob(x.url)), tier: "default", maxTokens: 8000 });
    pr.verdict = { ok: out.ok === true, kinds: [].concat(out.kinds || []), facts: [].concat(out.facts || []).map(String), privacy: [].concat(out.privacy || []).map(String), reason: String(out.reason || ""), at: new Date().toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" }) };
    (SHOTS[scope] || []).forEach(x => x.done = true); save(); saveShots(); go(view, false, true);
    toast(pr.verdict.ok ? "確認できました。この商品の文章に体験談を入れられます" : "まだ確認できませんでした。理由を見て、別の画像を足してください");
  } catch (err) { st.className = "status ng"; st.textContent = err.message || "うまくいきませんでした"; btn.disabled = false; }
}
async function rewriteExp(kind, pid, i) {
  const p = PLATFORMS.find(x => x.id === pid), pr = proofOf(pid);
  const target = kind === "res" ? S[pid + ".result"]?.strategies?.[i] : arr(pid + ".drafts")[i];
  const key = kind === "res" ? "body" : "text";
  if (!target || !pr) return;
  const lim = limitOf(p);
  const prompt = `次の${p.name}用の文章を、本人の実際の体験が伝わる形に書き直してください。

# 使ってよい体験（これ以外の体験は作らない）
${expRule(pid)}

# ルール
- 文字数の上限：${p.unit === "全角" ? `全角換算で${lim}字（半角は0.5字、URLは1本で全角12字）` : `${lim}字`}。少し短く収める
- リンクはそのまま残し、URL の直後に半角スペースと PR を付ける
${NG_PROMPT}
- 【あなたの体験：〇〇】の空欄は、上の事実とメモで埋められる所だけ埋める。埋められない所は空欄のまま残す
- 良い点だけでなく、不満な点・合わない人も正直に入れる
- 文章の型（切り口）は変えない

# 元の文章
${target[key]}

# 返す形式（この JSON だけ）
{ "text": "書き直した文章" }`;
  toast("書き直しています…（20秒〜1分ほど）");
  try {
    const out = await askAI(prompt, { tier: "default", maxTokens: 8000 });
    if (!out || !out.text) throw { message: "書き直しを受け取れませんでした" };
    target[key] = fixPR(String(out.text)); save(); go(view, false, true); toast("体験ありで書き直しました。内容が本当か必ず確認してください");
  } catch (err) { toast(err.message || "うまくいきませんでした"); }
}

function gate(s, p) {

function parseJSON(t) {
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: "invalid_json", message: "AIの返答を読み取れませんでした。もう一度お試しください。" };
}
async function blobToB64(blob) { const u = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); return u.split(",")[1]; }
function dataUrlToBlob(u) { const [h, b] = u.split(","); const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.match(/:(.*?);/)[1] }); }

// ---------- 画像の取り込み ----------
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = url; });
    const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}

  if (el.dataset && el.dataset.k && (el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT")) {
    setKey(el.dataset.k, el.value, el);
    if (el.id === "f-model") { const s = $("#connStatus"); if (s) s.textContent = "いまの接続：" + engineLabel(); }
    if (/\.proof$/.test(el.dataset.k)) { go(view, false, true); toast(proofOK(el.dataset.k.slice(0, -6)) ? "体験の証明あり：チェック項目と文章のルールを切り替えました" : "体験の証明なし：調べた情報として書くルールにしました"); }
  }
});

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function copy(textVal, label) {
  const fallback = () => { const pre = document.createElement("pre"); pre.className = "out"; pre.textContent = textVal; $("#app").append(pre); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); pre.scrollIntoView(); toast("自動でコピーできませんでした。選択した文章を長押しでコピーしてください"); };
  try { navigator.clipboard.writeText(textVal).then(() => toast(label + " をコピーしました"), fallback); } catch (e) { fallback(); }
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  if (t.id === "navHome") go("home");
  if (t.id === "copyBar") curRes() ? copy(resultMd(curRes()), "戦略") : copy(profileMd(), "profile.md");
  if (t.id === "copyResult" && curRes()) copy(resultMd(curRes()), "戦略");
  if (t.dataset.copybody !== undefined && curRes()) { const p = curRes(), s = S[p.id + ".result"].strategies[+t.dataset.copybody]; if (s) copyChecked(p, s.body || "", "本文", `${p.id}.res.${t.dataset.copybody}`); }
  if (t.dataset.fixbody !== undefined && curRes()) { const s = S[curRes().id + ".result"].strategies[+t.dataset.fixbody]; if (s) { s.body = fixPR(s.body || ""); save(); go(view, false, true); toast("リンクに「 PR」を付けました"); } }
  if (t.dataset.read) readShots(t.dataset.read);
  if (t.dataset.draft) makeDrafts(t.dataset.draft);
  if (t.dataset.logadd) { const pid = t.dataset.logadd, body = $(`#f-logbody-${pid}`).value.trim(); if (!body) { toast("投稿した本文を貼り付けてください"); return; } addLog(pid, { date: $(`#f-logdate-${pid}`).value || today(), type: $(`#f-logtype-${pid}`).value, body, url: $(`#f-logurl-${pid}`).value.trim() }); go(view, false, true); toast("記録しました。数日後に数字を入れてください"); }
  if (t.dataset.logfrom !== undefined && curRes()) { const p = curRes(), s = S[p.id + ".result"].strategies[+t.dataset.logfrom]; if (s) { addLog(p.id, { type: LOG_TYPES.includes(s.type) ? s.type : (LOG_TYPES.find(x => (s.type || "").includes(x.replace("型", ""))) || "その他"), body: s.body || "" }); toast(`${p.name}の記録に追加しました。数日後に数字を入れてください`); } }
  if (t.dataset.logdraft) { const pid = t.dataset.logdraft, d = arr(pid + ".drafts")[+t.dataset.i]; if (d) { addLog(pid, { type: LOG_TYPES.find(x => (d.title || "").includes(x.replace("型", ""))) || "その他", body: d.text || "" }); go(view, false, true); toast("記録に追加しました"); } }
  if (t.dataset.logai) reviewLog(t.dataset.logai);
  if (t.id === "proofAdd") { const name = $("#f-proofname").value.trim(); if (!name) { toast("商品・サービス名を入れてください"); return; } const L = arr("_proofs"); L.push({ id: Date.now().toString(36), name, verdict: null }); S._proofs = L; save(); go(view, false, true); }
  if (t.dataset.proofcheck) checkProof(t.dataset.proofcheck);
  if (t.dataset.rewrite) rewriteExp(t.dataset.rewrite, t.dataset.p, +t.dataset.i);
  if (["vmigrate", "vsave", "vcopy", "vedit", "vdel", "vcancel", "vbackup", "vrestore"].some(k => t.dataset[k] !== undefined)) vaultClick(t);
  if (t.dataset.logcopy) copy(logMd(PLATFORMS.find(x => x.id === t.dataset.logcopy)), "記録");
  if (t.dataset.copydraft) { const d = arr(t.dataset.copydraft + ".drafts")[+t.dataset.i]; if (d) copyChecked(PLATFORMS.find(x => x.id === t.dataset.copydraft), d.text || "", "下書き", `${t.dataset.copydraft}.d.${t.dataset.i}`); }
  if (t.dataset.fixpr) { const pid = t.dataset.fixpr, a = arr(pid + ".drafts"), d = a[+t.dataset.i]; if (d) { d.text = fixPR(d.text); save(); go(view, false, true); toast("リンクに「 PR」を付けました"); } }
  if (t.dataset.fixmy) { const pid = t.dataset.fixmy; S[pid + ".mydraft"] = fixPR(v(pid + ".mydraft")); save(); go(view, false, true); toast("リンクに「 PR」を付けました"); }
  if (t.dataset.copymy) { const pid = t.dataset.copymy; copyChecked(PLATFORMS.find(x => x.id === pid), v(pid + ".mydraft"), "文章", `${pid}.my`); }
  if (t.dataset.delshot) { SHOTS[t.dataset.delshot] = (SHOTS[t.dataset.delshot] || []).filter(s => s.id !== t.dataset.id); saveShots(); go(view, false, true); }
  if (t.dataset.add) { const a = arr(t.dataset.add).length ? arr(t.dataset.add) : [{}]; a.push({}); S[t.dataset.add] = a; save(); go(view, false, true); }
  if (t.dataset.del) { const a = arr(t.dataset.del); a.splice(+t.dataset.i, 1); S[t.dataset.del] = a; save(); go(view, false, true); }
  if (t.dataset.start) startMarketing(t.dataset.start);
  if (t.dataset.tmread) tmRead();
  if (t.dataset.tmgen) tmGen();
  if (t.id === "tmStop") tmCtl?.abort();
  if (t.dataset.tmreview) tmReview();
  if (t.dataset.tmcopy) { const x = tmPost(t.dataset.tmcopy); if (x) { if (tmBlocked(TP(), x.body)) toast("コピーできません：PR表記・【要確認】・禁止表現などを4ページで直してください"); else copyChecked(TP(), x.body, "本文", "threads.tm." + t.dataset.tmcopy); } }
  if (t.dataset.tmcopytree) { const G = S[TM + "gen"]; if (G?.tree) copyChecked(TP(), G.tree, "ツリー投稿", "threads.tm.tree"); }
  if (t.dataset.tmlog) { const x = tmPost(t.dataset.tmlog), [lv, i] = t.dataset.tmlog.split("-"); if (x) { addLog("threads", { type: "その他", body: x.body, memo: `投稿づくり：Lv${lv}・${+i + 1}本目${x.used ? "・" + x.used : ""}` }); toast("投稿の記録に追加しました（3ページの「そのほかの機能」にあります）"); } }
  if (t.id === "stopMk") mkCtl?.abort();
  if (t.id === "testConn") {
    const s = $("#connStatus"); s.className = "status"; s.textContent = "テスト中…"; t.disabled = true;
    try { const out = await askAI('{"ok": true} という JSON だけを返してください。', { tier: "quick", maxTokens: 2000 }); s.className = "status ok"; s.textContent = out && out.ok ? "接続できました：" + engineLabel() : "応答はありましたが形式が違いました"; }
    catch (err) { s.className = "status ng"; s.textContent = err.message; }
    finally { t.disabled = false; }
  }
});
