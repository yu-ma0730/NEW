<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
  /* Layout: 上に固定ナビ、1カラムの作業面。今やる1件(Focus)を一番強く、他は静かに。 */
  :root {
    --bg: #f1f4f3; --panel: #ffffff; --ink: #17201d; --muted: #5d6a66;
    --line: #dbe3e0; --accent: #1d6b58; --accent-ink: #ffffff; --accent-soft: #dcede7;
    --focus: #2a4d9b; --warn: #a8461f; --warn-soft: #f7e3da; --ok: #2f7a3e;
    --purpose: #6b4c9a; --shadow: 0 1px 2px rgba(23, 32, 29, .06);
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121816; --panel: #1a221f; --ink: #e6ece9; --muted: #98a6a1;
      --line: #2b3632; --accent: #5cc0a2; --accent-ink: #0d1a16; --accent-soft: #1f3a32;
      --focus: #86aef0; --warn: #ec9168; --warn-soft: #3d2a21; --ok: #7fcf8c;
      --purpose: #b89be6; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121816; --panel: #1a221f; --ink: #e6ece9; --muted: #98a6a1;
    --line: #2b3632; --accent: #5cc0a2; --accent-ink: #0d1a16; --accent-soft: #1f3a32;
    --focus: #86aef0; --warn: #ec9168; --warn-soft: #3d2a21; --ok: #7fcf8c;
    --purpose: #b89be6; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--bg); }
  .wrap { max-width: 960px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding-block: 10px; }
  .logo { font: 700 18px/1 var(--font-display); letter-spacing: .02em; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 2px; order: 3; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--muted); padding: 5px 12px; border-radius: 999px; text-decoration: none; white-space: nowrap; flex: none; }
  .sync { margin-left: auto; }
  @media (min-width: 880px) { nav { order: 0; flex: 1 1 auto; margin-inline: 0; } }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  nav a:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.cloud { background: var(--ok); } .dot.local { background: var(--focus); } .dot.none { background: var(--warn); }
  main { padding-block: 20px 80px; display: flex; flex-direction: column; gap: 16px; }
  h1, h2 { font-family: var(--font-display); text-wrap: balance; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  input, textarea, select { font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
  textarea { min-height: 72px; resize: vertical; }
  .btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.danger { color: var(--warn); }
  .btn.danger.primary { background: var(--warn); border-color: var(--warn); color: var(--panel); }
  .ghost { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); padding: 4px 6px;
    cursor: pointer; border-radius: 6px; }
  .ghost:hover { color: var(--ink); background: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input, .row > .grow { flex: 1 1 180px; min-width: 0; }
  .end { justify-content: flex-end; }
  .between { justify-content: space-between; }
  .focus-card { border: 2px solid var(--focus); }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--focus); font-weight: 700; }
  .focus-title { font: 700 clamp(20px, 4.5vw, 26px)/1.4 var(--font-display); word-break: break-word; }
  .crumb { color: var(--muted); font-size: 12px; word-break: break-word; }
  .empty { color: var(--muted); }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; word-break: break-word; }
  .done .grow, .done .title { text-decoration: line-through; color: var(--muted); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; padding: 0; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }
  .stats { display: flex; gap: 12px 40px; flex-wrap: wrap; }
  .stat { font: 700 28px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
  /* tree */
  .node { margin-left: 14px; border-left: 1px dashed var(--line); padding-left: 10px; }
  .node.root { margin-left: 0; border-left: 0; padding-left: 0; }
  .node.root + .node.root { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .nrow { display: flex; align-items: center; gap: 6px 8px; padding: 4px 0; flex-wrap: wrap; }
  .nrow .title { flex: 1 1 160px; min-width: 0; word-break: break-word; }
  .type { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex: none; }
  .type.purpose { background: var(--purpose); color: var(--panel); }
  .type.goal { background: var(--focus); color: var(--panel); }
  .type.todo { background: var(--line); color: var(--ink); }
  .pbar { width: 72px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .twisty { width: 24px; flex: none; }
  .addchild { margin: 4px 0 8px 24px; }
  .addchild select { width: auto; }
  /* coach */
  .chat { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
  .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--accent-soft); align-self: flex-end; max-width: 85%; }
  .msg.ai { background: var(--bg); border: 1px solid var(--line); max-width: 92%; }
  label { display: block; font-size: 13px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  /* help */
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 700; }
  details > div { padding-top: 6px; color: var(--ink); }
  details ol, details ul { margin: 6px 0 0; padding-left: 20px; }
  table.diag { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.diag th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 12px 6px 0; white-space: nowrap; vertical-align: top; width: 1%; }
  table.diag td { padding: 6px 0; word-break: break-word; }
  table.diag tr + tr { border-top: 1px solid var(--line); }
  .ok { color: var(--ok); } .ng { color: var(--warn); }
  pre.report { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 0; max-height: 240px; overflow: auto; }
  .notice { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    color: var(--ink); width: min(520px, calc(100% - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink);
    color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo">Self<span>OS</span></div>
    <nav id="nav" aria-label="画面">
      <a href="#today">今日</a>
      <a href="#goals">ゴールツリー</a>
      <a href="#review">壁打ち・振り返り</a>
      <a href="#prefs">設定</a>
      <a href="#help">ヘルプ・お問い合わせ</a>
    </nav>
    <a class="sync" id="syncBadge" href="#help" title="保存の状態（ヘルプで詳しく見られます）"><span class="dot" id="syncDot"></span><span id="syncText">読み込み中</span></a>
  </div>
</header>

<main class="wrap" id="app"></main>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>編集</h2>
    <div class="field"><label for="fTitle">タイトル</label><input id="fTitle" required></div>
    <div class="field"><label for="fType">種類</label>
      <select id="fType">
        <option value="purpose">目的（なぜやるか）</option>
        <option value="goal">ゴール（何を達成するか）</option>
        <option value="todo">ToDo（具体的な行動）</option>
      </select></div>
    <div class="field"><label for="fDue">期限</label><input id="fDue" type="date"></div>
    <div class="field"><label for="fNote">メモ</label><textarea id="fNote"></textarea></div>
    <div class="row end">
      <button class="btn" value="cancel" formnovalidate>キャンセル</button>
      <button class="btn primary" value="ok">保存</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <form method="dialog">
    <p id="askMsg"></p>
    <div class="row end">
      <button class="btn" value="no">やめる</button>
      <button class="btn danger primary" value="yes" id="askOk">削除する</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const APP_VERSION = '1.1.0';
const STORE_KEY = 'selfos.v1';
const DAILY_LIMIT = 3;
const CHAT_KEEP = 40; // クラウド保存の容量を超えないよう、会話は直近だけ残す
const API_MODEL = 'claude-sonnet-5-5';
const REPO_URL = 'https://github.com/yu-ma0730/NEW';
const VIEWS = ['today', 'goals', 'review', 'prefs', 'help'];
const TYPE_LABEL = { purpose: '目的', goal: 'ゴール', todo: 'ToDo' };

// ---------- 環境 ----------
// claude.ai 上で開いたときだけ window.claude.use がある。通常のブラウザでは無い。
const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
const caps = { db: null, user: null, sample: null, downloads: null, comments: null };

// ---------- 状態 ----------
const blank = () => ({ nodes: [], journal: [], chat: [], updatedAt: 0 });
let localOk = true;
let apiKey = '';
let state = loadLocal();
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today';
const sync = { mode: 'local', lastSaved: 0, error: '' }; // mode: connecting | cloud | local | none

function loadLocal() {
  try {
    apiKey = localStorage.getItem(STORE_KEY + '.key') || '';
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = Object.assign(blank(), JSON.parse(raw));
      delete s.settings; // 旧版はAPIキーを本体に入れていた
      return s;
    }
  } catch (e) { localOk = false; }
  return blank();
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch (e) { localOk = false; return false; }
}
function save() {
  state.updatedAt = Date.now();
  state.chat = state.chat.slice(-CHAT_KEEP);
  const ok = saveLocal();
  if (cloud.ref && cloud.writable) scheduleCloudWrite();
  else { sync.mode = ok ? 'local' : 'none'; if (ok) sync.lastSaved = Date.now(); }
  renderSync();
}

// ---------- クラウド保存（claude.ai 上で、サインインして書き込める人だけ） ----------
const cloud = { ref: null, writable: true, timer: 0, writing: null, dirty: false, gotFirst: false };

async function initCloud() {
  if (!hasClaude) return;
  sync.mode = 'connecting'; renderSync();
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  caps.db = db; caps.user = user;
  const id = user ? await user.id() : null;
  if (!db || !id) { sync.mode = localOk ? 'local' : 'none'; renderSync(); return; }
  if (user && (await user.can('data.write')) === false) cloud.writable = false;
  cloud.ref = db.doc('data/users/' + id + '/selfos');
  const timeout = setTimeout(() => {
    if (!cloud.gotFirst) { sync.error = 'クラウドに接続できません。このブラウザに保存しています。'; sync.mode = localOk ? 'local' : 'none'; renderSync(); }
  }, 10000);
  cloud.ref.onSnapshot(snap => {
    if (snap.metadata.fromCache && !snap.exists) return;
    if (!snap.metadata.fromCache) { clearTimeout(timeout); cloud.gotFirst = true; sync.error = ''; }
    const remote = snap.exists ? snap.data() : null;
    if (remote && !snap.metadata.hasPendingWrites && !cloud.dirty && (remote.updatedAt || 0) > state.updatedAt) {
      state = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
      saveLocal();
      if (!isTyping()) render();
    } else if (!snap.metadata.fromCache && cloud.writable && (!remote || (remote.updatedAt || 0) < state.updatedAt) && hasData()) {
      scheduleCloudWrite(); // 手元のほうが新しい（または初回）ならクラウドへ送る
    }
    if (cloud.writable) { sync.mode = 'cloud'; if (!sync.lastSaved) sync.lastSaved = (remote && remote.updatedAt) || Date.now(); }
    else sync.mode = localOk ? 'local' : 'none';
    renderSync();
  }, err => {
    clearTimeout(timeout);
    sync.error = 'クラウド保存が止まりました（' + err.code + '）。このブラウザに保存しています。';
    cloud.ref = null; sync.mode = localOk ? 'local' : 'none'; renderSync();
  });
}
const hasData = () => state.nodes.length || state.journal.length || state.chat.length;

function scheduleCloudWrite() {
  cloud.dirty = true;
  sync.mode = 'cloud';
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(writeCloud, 700);
}
async function writeCloud() {
  if (cloud.writing) { await cloud.writing; }
  if (!cloud.ref || !cloud.dirty) return;
  cloud.dirty = false;
  const body = JSON.parse(JSON.stringify(state));
  cloud.writing = cloud.ref.set(body).then(() => {
    sync.lastSaved = Date.now(); sync.error = '';
  }).catch(err => {
    if (err.code === 'unavailable') { cloud.dirty = true; setTimeout(writeCloud, 1500 + Math.random() * 1500); return; }
    cloud.writable = false;
    sync.mode = localOk ? 'local' : 'none';
    sync.error = err.code === 'quota_exceeded'
      ? 'クラウドの容量がいっぱいです。古い振り返りや壁打ちの履歴を消してください。今はこのブラウザに保存しています。'
      : 'クラウドに保存できません（' + err.code + '）。このブラウザに保存しています。';
    toast(sync.error);
  }).finally(() => { cloud.writing = null; renderSync(); });
}
function isTyping() {
  const a = document.activeElement;
  return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox';
}

// ---------- データ操作 ----------
let orderSeq = 0;
const nextOrder = () => (orderSeq = Math.max(Date.now(), orderSeq + 1)); // 単調増加（同じミリ秒でも順序を保つ）
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const dateStr = d => d.toLocaleDateString('sv-SE'); // ローカル時刻の YYYY-MM-DD
const today = () => dateStr(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const byId = id => state.nodes.find(n => n.id === id);
const children = id => state.nodes.filter(n => n.parentId === id).sort((a, b) => a.order - b.order);

function addNode(parentId, title, type, extra = {}) {
  const n = { id: uid(), parentId, title: String(title).trim(), type, done: false, due: '', note: '',
    focusDate: '', order: nextOrder(), created: nextOrder(), doneAt: 0, ...extra };
  state.nodes.push(n);
  return n;
}
function removeNode(id) {
  const kill = new Set([id]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const n of state.nodes) if (!kill.has(n.id) && kill.has(n.parentId)) { kill.add(n.id); grew = true; }
  }
  state.nodes = state.nodes.filter(n => !kill.has(n.id));
}
function descendantTodos(id) {
  const out = [];
  for (const c of children(id)) {
    if (c.type === 'todo') out.push(c);
    out.push(...descendantTodos(c.id));
  }
  return out;
}
function progress(node) {
  if (node.type === 'todo') return node.done ? 1 : 0;
  const t = descendantTodos(node.id);
  return t.length ? t.filter(x => x.done).length / t.length : 0;
}
function path(node) {
  const p = [];
  let cur = node && byId(node.parentId);
  while (cur) { p.unshift(cur.title); cur = byId(cur.parentId); }
  return p.join(' › ');
}
function setDone(node, done) { node.done = done; node.doneAt = done ? Date.now() : 0; }

// ---------- フォーカスの決め方 ----------
const openTodos = () => state.nodes.filter(n => n.type === 'todo' && !n.done);
const isOverdue = n => n.due && n.due < today();
function rank(a, b) {
  // 今日やると決めたもの > 期限が早いもの（期限切れ含む） > 期限なし > 古いもの
  const fa = a.focusDate === today() ? 0 : 1, fb = b.focusDate === today() ? 0 : 1;
  if (fa !== fb) return fa - fb;
  const da = a.due || '9999', db = b.due || '9999';
  if (da !== db) return da < db ? -1 : 1;
  return a.created - b.created;
}
const sessionSkip = new Set();
function focusTodo() {
  const list = openTodos().sort(rank);
  return list.find(n => !sessionSkip.has(n.id)) || list[0] || null;
}
const dailyList = () => state.nodes.filter(n => n.type === 'todo' && n.focusDate === today()).sort(rank);
function autoPickDaily() {
  const cur = dailyList().filter(n => !n.done);
  for (const n of openTodos().filter(n => n.focusDate !== today()).sort(rank)) {
    if (cur.length >= DAILY_LIMIT) break;
    n.focusDate = today();
    cur.push(n);
  }
}
function streak() {
  const days = new Set(state.nodes.filter(n => n.doneAt).map(n => dateStr(new Date(n.doneAt))));
  let count = 0;
  const d = new Date();
  if (!days.has(dateStr(d))) d.setDate(d.getDate() - 1);
  while (days.has(dateStr(d))) { count++; d.setDate(d.getDate() - 1); }
  return count;
}

// ---------- AI ----------
// claude.ai 上: sample 機能（APIキー不要）。通常のブラウザ: 設定したAPIキーで直接呼ぶ。
const aiMode = () => caps.sample ? 'claude' : (!hasClaude && apiKey ? 'apikey' : 'none');

async function askAI(turns, { json = false, onText } = {}) {
  if (caps.sample) {
    try {
      if (json) return await caps.sample.json(turns, { modelTier: 'default' });
      const { text } = await caps.sample(turns, { cache: false, onText: onText ? ({ text }) => onText(text) : undefined });
      return text;
    } catch (e) {
      if (e.code === 'not_granted') { caps.sample = null; throw new Error('AIの利用が許可されていません。ヘルプの「AIが動かない」を見てください'); }
      if (e.code === 'rate_limited') throw new Error('AIへの問い合わせが多すぎます。少し待ってからもう一度押してください');
      throw new Error(e.message || e.code || 'AIでエラーが起きました');
    }
  }
  if (!apiKey) throw new Error('AIが使えない状態です');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: API_MODEL, max_tokens: 2000, messages: mergeTurns(turns) })
  });
  if (!res.ok) throw new Error(res.status === 401 ? 'APIキーが正しくありません（401）' : 'APIエラー ' + res.status);
  const data = await res.json();
  const text = data.content.filter(c => c.type === 'text').map(c => c.text).join('');
  if (!json) return text;
  const m = text.match(/[[{][\s\S]*[\]}]/);
  if (!m) throw new Error('AIの返事を読み取れませんでした。もう一度押してください');
  return JSON.parse(m[0]);
}
// Messages API は user/assistant が交互である必要があるので、連続する同じ役割をまとめる
function mergeTurns(turns) {
  const out = [];
  for (const t of typeof turns === 'string' ? [{ role: 'user', content: turns }] : turns) {
    const last = out[out.length - 1];
    if (last && last.role === t.role) last.content += '\n\n' + t.content;
    else out.push({ role: t.role, content: t.content });
  }
  return out;
}

function treeOutline() {
  const lines = [];
  const walk = (id, depth) => {
    for (const n of children(id)) {
      lines.push('  '.repeat(depth) + `- [${TYPE_LABEL[n.type]}${n.type === 'todo' ? (n.done ? '/完了' : '/未完') : ''}] ${n.title}${n.due ? '（期限 ' + n.due + '）' : ''}`);
      walk(n.id, depth + 1);
    }
  };
  walk(null, 0);
  return lines.join('\n') || '（まだ何も登録されていません）';
}

function templateBreakdown(title) {
  return [
    { title: `「${title}」の現状と完成形をはっきりさせる`, todos: ['達成できた状態を1文で書く', '今の自分との差を3つ書き出す', '使える時間・お金・人を棚卸しする'] },
    { title: '最初の一歩を実行する', todos: ['15分でできる最小の行動を決めて実行する', '参考になる人・情報を1つ調べる', '今週の作業時間をカレンダーに確保する'] },
    { title: '続ける仕組みを作り、振り返る', todos: ['毎週の振り返り日時を決める', '進捗を測る指標を1つ決める', '1週間後に計画を見直す'] }
  ];
}
async function breakdown(node) {
  let plan, usedAI = false;
  if (aiMode() !== 'none') {
    const prompt = 'あなたは目標達成コーチです。次の目標を、達成に必要な中間ゴール（3〜5個）と、それぞれの具体的なToDo（各2〜4個、1つ30分〜2時間で終わる粒度、動詞で終わる日本語）に分解してください。\n'
      + '出力はJSONの配列だけ: [{"title":"中間ゴール","todos":["ToDo", "..."]}]\n\n'
      + `分解する目標: ${node.title}\n上位の目的・ゴール: ${path(node) || 'なし'}\nメモ: ${node.note || 'なし'}\n今のゴールツリー:\n${treeOutline()}`;
    const out = await askAI(prompt, { json: true });
    if (!Array.isArray(out) || !out.length) throw new Error('AIの返事を読み取れませんでした。もう一度押してください');
    plan = out; usedAI = true;
  } else {
    plan = templateBreakdown(node.title);
  }
  for (const g of plan.slice(0, 6)) {
    if (!g || !g.title) continue;
    const sub = addNode(node.id, String(g.title).slice(0, 200), 'goal');
    for (const t of (Array.isArray(g.todos) ? g.todos : []).slice(0, 6)) addNode(sub.id, String(t).slice(0, 200), 'todo');
  }
  save();
  return usedAI;
}

  document.getElementById('rGithub').href = url;
}

// ---------- 例データ ----------
function loadSample() {
  const p = addNode(null, '（例）自分の力で稼げる人になる', 'purpose');
  const g1 = addNode(p.id, '3か月でポートフォリオを3つ公開する', 'goal');
  const s1 = addNode(g1.id, '1つ目：データ可視化ツール', 'goal');
  addNode(s1.id, '扱うデータを決める', 'todo', { focusDate: today() });
  addNode(s1.id, '画面のラフを描く', 'todo');
  addNode(s1.id, 'GitHubに公開してREADMEを書く', 'todo');
  const g2 = addNode(p.id, '毎朝の習慣を固める', 'goal');
  addNode(g2.id, '6:30に起きる', 'todo', { focusDate: today() });
  addNode(g2.id, '朝15分だけ計画を見直す', 'todo');
}

// ---------- 確認ダイアログ（ブラウザ標準の confirm は使わない） ----------
function ask(message, okLabel = '削除する') {
  const dlg = document.getElementById('askDlg');
  document.getElementById('askMsg').textContent = message;
  document.getElementById('askOk').textContent = okLabel;
  dlg.returnValue = '';
  return new Promise(res => {
    dlg.addEventListener('close', () => res(dlg.returnValue === 'yes'), { once: true });
    dlg.showModal();
  });
}

// ---------- 書き出し・読み込み ----------
const exportJson = () => JSON.stringify({ app: 'selfos', version: APP_VERSION, ...state }, null, 2);
function importData(data) {
  if (!data || !Array.isArray(data.nodes)) throw new Error('Self OS のデータではありません');
  state = Object.assign(blank(), { nodes: data.nodes, journal: data.journal || [], chat: data.chat || [] });
  save();
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { toast('コピーできませんでした。表示された文を長押し（右クリック）でコピーしてください'); return false; }
  return true;
}

// ---------- イベント ----------
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (VIEWS.includes(v) && v !== view) { view = v; addingTo = null; render(); window.scrollTo(0, 0); }
});

app.addEventListener('input', e => { if (e.target.closest('#reportCard')) updateReport(); });
app.addEventListener('change', async e => {
  if (e.target.closest('#reportCard')) { updateReport(); return; }
  if (e.target.id !== 'importFile') return;
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!(await ask('今のデータを、読み込んだファイルの内容で置き換えます。よろしいですか？', '置き換える'))) return;
    importData(data); toast('読み込みました'); render();
  } catch (err) { toast('読み込めませんでした：' + err.message); }
  e.target.value = '';
});

app.addEventListener('submit', async e => {
  const form = e.target;
  e.preventDefault();
  const t = form.t ? form.t.value.trim() : '';
  switch (form.dataset.form) {
    case 'quick':
      if (!t) return;
      addNode(null, t, 'todo', { focusDate: today() });
      save(); render(); document.getElementById('quickInput').focus(); return;
    case 'root':
      if (!t) return;
      addNode(null, t, form.type.value);
      save(); render(); document.getElementById('rootInput').focus(); return;
    case 'child':
      if (!t) return;
      addNode(form.dataset.parent, t, form.type.value);
      collapsed.delete(form.dataset.parent);
      save(); render(); return; // 入力欄は開いたままにして、続けて追加できるようにする
    case 'key':
      apiKey = form.k.value.trim();
      try { apiKey ? localStorage.setItem(STORE_KEY + '.key', apiKey) : localStorage.removeItem(STORE_KEY + '.key'); } catch (err) { /* 保存できなくても今回は使える */ }
      toast(apiKey ? 'APIキーを保存しました' : 'APIキーを削除しました'); return;
    case 'journal': {
      const entry = { date: today(), good: form.good.value.trim(), stuck: form.stuck.value.trim(), next: form.next.value.trim() };
      const i = state.journal.findIndex(j => j.date === entry.date);
      const prevNext = i >= 0 ? state.journal[i].next : '';
      if (i >= 0) state.journal[i] = entry; else state.journal.push(entry);
      if (form.mk.checked && entry.next && entry.next !== prevNext) {
        const d = new Date(); d.setDate(d.getDate() + 1);
        addNode(null, entry.next, 'todo', { focusDate: dateStr(d), due: dateStr(d) });
      }
      save(); toast('保存しました'); render(); return;
    }
    case 'chat': {
      if (!t || chatPending) return;
      state.chat.push({ role: 'user', content: t });
      chatPending = '考え中…';
      save(); render();
      const rules = `あなたはユーザー専属の思考整理パートナー兼コーチです。日本語で、簡潔に、具体的な次の一手を示してください。必要なら質問で考えを引き出してください。今日は${today()}です。ユーザーのゴールツリー:\n${treeOutline()}`;
      try {
        const reply = await askAI([{ role: 'user', content: rules }, ...state.chat.slice(-20)], {
          onText: text => { chatPending = text; const p = document.getElementById('pending'); if (p) p.textContent = text; }
        });
        state.chat.push({ role: 'assistant', content: reply });
      } catch (err) {
        state.chat.push({ role: 'assistant', content: 'エラー：' + err.message });
      }
      chatPending = '';
      save(); if (view === 'review') render();
      return;
    }
  }
});

app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const n = el.dataset.id ? byId(el.dataset.id) : null;
  if (el.dataset.id && !n) { render(); return; }
  switch (el.dataset.act) {
    case 'toggle': setDone(n, el.checked); break;
    case 'done-focus': setDone(n, true); toast('おつかれさま！'); break;
    case 'skip': sessionSkip.add(n.id); render(); return;
    case 'focus':
      if (dailyList().filter(x => !x.done).length >= DAILY_LIMIT) toast(`今日の${DAILY_LIMIT}つを超えました。絞り込むのも大事です`);
      n.focusDate = today(); break;
    case 'unfocus': n.focusDate = ''; break;
    case 'autopick': autoPickDaily(); break;
    case 'collapse': collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id); render(); return;
    case 'addchild': addingTo = addingTo === n.id ? null : n.id; collapsed.delete(n.id); render(); return;
    case 'canceladd': addingTo = null; render(); return;
    case 'edit': openEdit(n); return;
    case 'delete': {
      const count = descendantTodos(n.id).length + children(n.id).filter(c => c.type !== 'todo').length;
      if (!(await ask(`「${n.title}」${count ? 'と、その下の項目すべて' : ''}を削除します。元に戻せません。`))) return;
      removeNode(n.id); if (addingTo === n.id) addingTo = null; break;
    }
    case 'breakdown':
      busy.add(n.id); render();
      try { const usedAI = await breakdown(n); collapsed.delete(n.id); toast(usedAI ? 'AIで分解しました' : 'テンプレートで分解しました'); }
      catch (err) { toast(err.message); }
      busy.delete(n.id); render(); return;
    case 'clearchat':
      if (!(await ask('壁打ちの会話をすべて消します。', '消す'))) return;
      state.chat = []; break;
    case 'export': {
      const name = `selfos-${today()}.json`;
      if (caps.downloads) {
        try { await caps.downloads.save({ filename: name, data: exportJson() }); }
        catch (err) { if (err.code !== 'declined') toast('書き出せませんでした。「中身をコピー」を使ってください'); }
      } else if (!hasClaude) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([exportJson()], { type: 'application/json' }));
        a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      } else toast('このページではファイルに書き出せません。「中身をコピー」を使ってください');
      return;
    }
    case 'copyjson': copyText(exportJson(), 'コピーしました。メモ帳などに貼って保管してください'); return;
    case 'pastejson': {
      try {
        const data = JSON.parse(document.getElementById('pasteJson').value);
        if (!(await ask('今のデータを、貼り付けた内容で置き換えます。よろしいですか？', '置き換える'))) return;
        importData(data); toast('戻しました');
      } catch (err) { toast('読み取れませんでした：' + err.message); return; }
      break;
    }
    case 'sample': loadSample(); toast('例のデータを追加しました（「（例）」が付いています）'); break;
    case 'reset':
      if (!(await ask('すべてのデータを削除します。元に戻せません。先に「ファイルに書き出す」で保存しておくことをおすすめします。'))) return;
      state = blank(); sessionSkip.clear(); break;
    case 'recheck': renderSync(); toast('調べ直しました'); return;
    case 'copyreport': copyText(reportText(), '報告文をコピーしました'); return;
    case 'commentreport': {
      try {
        const r = await caps.comments.openComposer({ element: document.getElementById('reportCard') });
        if (!r.opened) toast('コメント欄を開けませんでした。「報告文をコピー」を使ってください');
        else copyText(reportText(), '報告文をコピーしました。コメント欄に貼り付けてください');
      } catch (err) { toast('コメント欄を開けませんでした。「報告文をコピー」を使ってください'); }
      return;
    }
    default: return;
  }
  save(); render();
});

const dlg = document.getElementById('editDlg');
let editing = null;
function openEdit(n) {
  editing = n;
  document.getElementById('fTitle').value = n.title;
  document.getElementById('fType').value = n.type;
  document.getElementById('fDue').value = n.due;
  document.getElementById('fNote').value = n.note;
  dlg.returnValue = '';
  dlg.showModal();
}
dlg.addEventListener('close', () => {
  if (dlg.returnValue === 'ok' && editing && byId(editing.id)) {
    editing.title = document.getElementById('fTitle').value.trim() || editing.title;
    editing.type = document.getElementById('fType').value;
    editing.due = document.getElementById('fDue').value;
    editing.note = document.getElementById('fNote').value;
    save(); render();
  }
  editing = null;
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

// ---------- 起動 ----------
if (!localOk) { sync.mode = 'none'; sync.error = 'このブラウザでは保存が許可されていません（シークレットウィンドウなど）。'; }
render();
if (hasClaude) {
  initCloud();
  Promise.all([window.claude.use('sample'), window.claude.use('downloads'), window.claude.use('comments')])
    .then(([s, d, c]) => { caps.sample = s; caps.downloads = d; caps.comments = c; if (!isTyping()) render(); });
}
