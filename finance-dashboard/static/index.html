<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融データ可視化ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            color: white;
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.3s;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 6px;
        }

        .stock-item:hover {
            background: #f9f9f9;
        }

        .stock-item:last-child {
            border-bottom: none;
        }

        .stock-info {
            flex: 1;
        }

        .stock-symbol {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .stock-name {
            color: #999;
            font-size: 13px;
            margin-top: 3px;
        }

        .stock-price {
            text-align: right;
            margin-right: 20px;
        }

        .price {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .change {
            font-size: 14px;
            margin-top: 3px;
            font-weight: 600;
        }

        .change.positive {
            color: #28a745;
        }

        .change.negative {
            color: #dc3545;
        }

        .portfolio-summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
        }

        .summary-label {
            color: #666;
        }

        .summary-value {
            font-weight: 600;
            color: #333;
        }

        .summary-value.positive {
            color: #28a745;
        }

        .summary-value.negative {
            color: #dc3545;
        }

        .holding-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .holding-item:last-child {
            border-bottom: none;
        }

        .holding-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .holding-symbol {
            font-weight: 600;
            color: #333;
        }

        .holding-value {
            color: #667eea;
            font-weight: 600;
        }

        .holding-details {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .detail-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header h3 {
            color: #333;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .chart-container {
            margin-top: 20px;
            height: 300px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 金融データ可視化ダッシュボード</h1>
            <p class="subtitle">リアルタイム株価トラッキングとポートフォリオ管理</p>
        </header>

        <div class="dashboard">
            <!-- 株価リスト -->
            <div class="card">
                <h2>📈 リアルタイム株価</h2>
                <div id="stocksList" class="loading">読み込み中...</div>
            </div>

            <!-- ポートフォリオ -->
            <div class="card">
                <h2>💼 ポートフォリオ</h2>
                <div id="portfolioSummary" class="portfolio-summary">
                    <div class="summary-row">
                        <span class="summary-label">総資産</span>
                        <span class="summary-value" id="totalValue">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">評価損益</span>
                        <span class="summary-value" id="totalGainLoss">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">収益率</span>
                        <span class="summary-value" id="totalGainLossPercent">-</span>
                    </div>
                </div>
                <div id="holdingsList" class="loading">読み込み中...</div>
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div class="detail-modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalStockName"></h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script>
        const API_BASE = location.origin;
        let chart = null;

        // 初期化
        async function init() {
            await loadStocks();
            await loadPortfolio();
        }

        // 株価一覧を読み込む
        async function loadStocks() {
            try {
                const response = await fetch(`${API_BASE}/api/stocks`);
                const data = await response.json();

                if (data.success) {
                    displayStocks(data.stocks);
                }
            } catch (error) {
                console.error('Error loading stocks:', error);
                document.getElementById('stocksList').innerHTML = '<p style="color: red;">エラー: 株価データを読み込めません</p>';
            }
        }

        // 株価を表示
        function displayStocks(stocks) {
            const html = stocks.map(stock => `
                <div class="stock-item" onclick="showStockDetail('${stock.symbol}')">
                    <div class="stock-info">
                        <div class="stock-symbol">${stock.symbol}</div>
                        <div class="stock-name">${stock.name}</div>
                    </div>
                    <div class="stock-price">
                        <div class="price">$${stock.price.toFixed(2)}</div>
                        <div class="change ${stock.change >= 0 ? 'positive' : 'negative'}">
                            ${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)} (${stock.changePercent >= 0 ? '+' : ''}${stock.changePercent.toFixed(2)}%)
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('stocksList').innerHTML = html;
        }

        // ポートフォリオを読み込む
        async function loadPortfolio() {
            try {
                const response = await fetch(`${API_BASE}/api/portfolio`);
                const data = await response.json();

                if (data.success) {
                    displayPortfolio(data);
                }
            } catch (error) {
                console.error('Error loading portfolio:', error);
                document.getElementById('portfolioSummary').innerHTML = '<p style="color: red;">エラー: ポートフォリオを読み込めません</p>';
            }
        }

        // ポートフォリオを表示
        function displayPortfolio(data) {
            // サマリー
            document.getElementById('totalValue').innerHTML = `$${data.totalValue.toFixed(2)}`;
            const gainLossEl = document.getElementById('totalGainLoss');
            gainLossEl.innerHTML = `${data.totalGainLoss >= 0 ? '+' : ''}$${data.totalGainLoss.toFixed(2)}`;
            gainLossEl.className = `summary-value ${data.totalGainLoss >= 0 ? 'positive' : 'negative'}`;

            const gainLossPercentEl = document.getElementById('totalGainLossPercent');
            gainLossPercentEl.innerHTML = `${data.totalGainLossPercent >= 0 ? '+' : ''}${data.totalGainLossPercent.toFixed(2)}%`;
            gainLossPercentEl.className = `summary-value ${data.totalGainLossPercent >= 0 ? 'positive' : 'negative'}`;

            // ホールディング
            const html = data.portfolio.map(holding => `
                <div class="holding-item">
                    <div class="holding-header">
                        <span class="holding-symbol">${holding.symbol}</span>
                        <span class="holding-value">${holding.currentValue.toFixed(2)}</span>
                    </div>
                    <div class="holding-details">
                        <span>${holding.shares}株 @ $${holding.currentPrice.toFixed(2)}</span>
                        <span class="${holding.gainLoss >= 0 ? 'positive' : 'negative'}">
                            ${holding.gainLoss >= 0 ? '+' : ''}${holding.gainLoss.toFixed(2)} (${holding.gainLossPercent >= 0 ? '+' : ''}${holding.gainLossPercent.toFixed(2)}%)
                        </span>
                    </div>
                </div>
            `).join('');

            document.getElementById('holdingsList').innerHTML = html;
        }

        // 株の詳細を表示
        async function showStockDetail(symbol) {
            try {
                const response = await fetch(`${API_BASE}/api/stock/${symbol}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('modalStockName').textContent = `${data.symbol} - ${data.name}`;

                    const html = `
                        <div style="margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span style="color: #666;">現在価格</span>
                                <span style="font-size: 20px; font-weight: 600; color: #333;">$${data.price.toFixed(2)}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span style="color: #666;">変動</span>
                                <span style="font-weight: 600; ${data.change >= 0 ? 'color: #28a745;' : 'color: #dc3545;'}">
                                    ${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)} (${data.changePercent >= 0 ? '+' : ''}${data.changePercent.toFixed(2)}%)
                                </span>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="detailChart"></canvas>
                        </div>
                    `;

                    document.getElementById('modalBody').innerHTML = html;

                    // チャート表示
                    setTimeout(() => {
                        drawChart(data.history);
                    }, 100);

                    document.getElementById('detailModal').classList.add('show');
                }
            } catch (error) {
                console.error('Error loading stock detail:', error);
                alert('エラー: 詳細データを読み込めません');
            }
        }

        // チャートを描画
        function drawChart(history) {
            const ctx = document.getElementById('detailChart');
            if (!ctx) return;

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => h.date),
                    datasets: [{
                        label: '株価',
                        data: history.map(h => h.price),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }

        // モーダルを閉じる
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // ページロード時に初期化
        window.addEventListener('load', init);
    </script>
</body>
</html>
