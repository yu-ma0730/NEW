<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIコンサルティング ご相談窓口</title>
  <meta name="description" content="AI×Webデザイン、AI×データなど、AI活用のご相談を受け付けています。まずはお気軽にお話をお聞かせください。">
  <link rel="stylesheet" href="style.css">
</head>
<body data-genre="">

  <!-- ヘッダー（全ページ共通。ジャンルのリンクは script.js の GENRES から自動で作られます） -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">AI</span><span class="logo-text">Consulting</span></a>
      <nav class="genre-nav" aria-label="ご相談ジャンル"><ul id="genre-nav-list"></ul></nav>
    </div>
  </header>

  <main>

    <!-- ============================================
         メイン画像（ヒーロー）エリア
         ★画像を差し替えるには★
           1. 好きな画像を images フォルダに入れる（例: images/hero.jpg）
           2. 下の src="images/hero.svg" を src="images/hero.jpg" に書き換える
           3. alt="..." も画像の内容に合わせて書き換える
         ============================================ -->
    <section class="hero">
      <div class="hero-text">
        <p class="hero-eyebrow">AI CONSULTING</p>
        <h1>あなたの「やりたい」を、<br>AIで形にする。</h1>
        <p class="hero-lead">
          Webデザイン、データ活用、業務効率化など、<br class="pc-only">
          AIをどう使えばいいか分からない段階からご相談いただけます。<br>
          まずは一度、お話をお聞かせください。
        </p>
        <a href="#genres" class="btn btn-primary">ご相談ジャンルを見る</a>
      </div>
      <div class="hero-image">
        <!-- ▼▼▼ メイン画像はここ ▼▼▼ -->
        <img src="images/hero.svg" alt="AIコンサルティングのイメージ画像">
        <!-- ▲▲▲ メイン画像はここ ▲▲▲ -->
      </div>
    </section>

    <!-- ジャンル一覧（カードは script.js の GENRES から自動で作られます） -->
    <section id="genres" class="section">
      <div class="section-head">
        <h2>ご相談ジャンル</h2>
        <p>気になるジャンルを選ぶと、詳しい説明とご相談フォームのページに移動します。</p>
      </div>
      <div id="genre-list" class="genre-list"></div>
    </section>

  </main>

  <footer class="site-footer"><p>&copy; <span id="year"></span> AI Consulting</p></footer>

  <script src="script.js"></script>
</body>
</html>
