<!-- 仮のメイン画像です。images/hero.jpg などに差し替えて使ってください -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#13b5a6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2">
    <circle cx="400" cy="300" r="170"/>
    <circle cx="400" cy="300" r="240"/>
    <line x1="230" y1="300" x2="570" y2="300"/>
    <line x1="400" y1="130" x2="400" y2="470"/>
  </g>
  <g fill="#ffffff">
    <circle cx="230" cy="300" r="10"/>
    <circle cx="570" cy="300" r="10"/>
    <circle cx="400" cy="130" r="10"/>
    <circle cx="400" cy="470" r="10"/>
  </g>
  <text x="400" y="325" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="800" fill="#ffffff">AI ×</text>
  <text x="400" y="560" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#ffffff" fill-opacity=".8">仮画像：images フォルダの画像と差し替えてください</text>
</svg>
