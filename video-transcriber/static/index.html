<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画文字起こし</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f26; --fg:#e6e8ec; --muted:#9aa3b2; --accent:#60a5fa; --border:#2c323c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border:1px solid var(--border); background:var(--bg); color:var(--fg); }
  input[type=url] { width: 100%; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  label { font-size: .9rem; color: var(--muted); }
  button.primary { background:var(--accent); color:#fff; border:none; cursor:pointer; padding:10px 20px; }
  button:disabled { opacity:.5; cursor:wait; }
  pre.log { max-height: 200px; overflow:auto; font-size:.8rem; color:var(--muted); white-space:pre-wrap; margin:0; }
  textarea { width:100%; min-height:260px; font: .95rem/1.6 inherit; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--fg); }
  .meta { font-size:.85rem; color:var(--muted); margin:4px 0 12px; }
  .dl a { margin-right: 12px; color: var(--accent); }
  .error { color:#dc2626; }
</style>
</head>
<body>
<main>
  <h1>🎬 動画文字起こしツール</h1>
  <p class="lead">ページの URL を入れると、そのページにある動画を見つけて文字起こしします。字幕があれば字幕を、無ければ Whisper で音声を認識します。</p>

  <form class="card" id="form">
    <input type="url" id="url" placeholder="https://..." required>
    <div class="row">
      <label>言語 <select id="language">
        <option value="">自動判定</option><option value="ja">日本語</option><option value="en">英語</option>
      </select></label>
      <label>精度 <select id="model">
        <option value="tiny">tiny（最速）</option><option value="base">base</option>
        <option value="small" selected>small（標準）</option><option value="medium">medium</option>
        <option value="large-v3">large-v3（高精度・低速）</option>
      </select></label>
      <label><input type="checkbox" id="subs" checked> 既存の字幕を優先</label>
      <button class="primary" id="btn">文字起こし開始</button>
    </div>
  </form>

  <div class="card" id="progress" hidden><pre class="log" id="log"></pre></div>
  <div id="results"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("btn").disabled = true; $("results").innerHTML = ""; $("progress").hidden = false; $("log").textContent = "開始しています…";
  try {
    const res = await fetch("/api/jobs", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ url:$("url").value, language:$("language").value || null, model:$("model").value, use_subtitles:$("subs").checked }) });
    if (!res.ok) throw new Error((await res.json()).detail);
    poll((await res.json()).job_id);
  } catch (err) { showError(err.message); }
});

async function poll(id) {
  const job = await (await fetch(`/api/jobs/${id}`)).json();
  $("log").textContent = job.logs.join("\n"); $("log").scrollTop = 1e9;
  if (job.status === "done") return showResults(id, job.results);
  if (job.status === "error") return showError(job.error);
  setTimeout(() => poll(id), 1500);
}

function showResults(id, results) {
  $("btn").disabled = false;
  $("results").innerHTML = results.map((r, i) => `
    <div class="card">
      <strong>${esc(r.title)}</strong>
      <div class="meta">方式: ${esc(r.method)} ／ 言語: ${esc(r.language || "?")} ／ <a href="${esc(r.url)}" target="_blank" rel="noopener">元動画</a></div>
      <textarea readonly>${esc(r.text)}</textarea>
      <div class="row dl">
        <button type="button" onclick="navigator.clipboard.writeText(this.closest('.card').querySelector('textarea').value)">コピー</button>
        ${["txt","srt","vtt","json"].map(f => `<a href="/api/jobs/${id}/${i}.${f}">.${f}</a>`).join("")}
      </div>
    </div>`).join("");
}

function showError(msg) {
  $("btn").disabled = false;
  $("results").innerHTML = `<div class="card error">エラー: ${esc(msg)}</div>`;
}
</script>
</body>
</html>
