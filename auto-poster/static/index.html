<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動投稿スケジューラー</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --accent-soft: #e0e9fd; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    --x: #111827; --threads: #7c3aed; --blog: #0891b2; --x-blue: #1d9bf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --line: #2b303a;
      --accent: #5b8cff; --accent-soft: #23304d; --x: #d1d5db; --threads: #a78bfa; --blog: #22b8d4;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  .badge.test { color: var(--warn); border-color: var(--warn); }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 0 20px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label.field { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=time] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 10px; font-size: 12px;
          display: inline-flex; gap: 6px; align-items: center; }
  .chip button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; width: 100%; margin-top: 16px; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--text); padding: 4px 10px; font-weight: 500; }
  .btn.danger { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; margin-right: 3px; vertical-align: middle; }
  .dot.x { background: var(--x); } .dot.threads { background: var(--threads); } .dot.blog { background: var(--blog); }

  /* ---------- 投稿先タブ ---------- */
  .tabs { display: flex; gap: 6px; }
  .tab { flex: 1; border: 1px solid var(--line); background: none; color: var(--text); border-radius: 8px 8px 0 0;
         padding: 8px 4px; font: inherit; cursor: pointer; position: relative; border-bottom: 0; opacity: .75; }
  .tab.active { opacity: 1; font-weight: 700; background: var(--bg); }
  .tab .on-mark { margin-left: 4px; color: var(--ok); font-weight: 700; }
  .tab:not(.enabled) { color: var(--muted); }
  .panel { border: 1px solid var(--line); border-radius: 0 0 10px 10px; padding: 12px; background: var(--bg); }
  .panel-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  .switch input { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative;
                  cursor: pointer; margin: 0; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 99px;
                         background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--ok); }
  .switch input:checked::after { left: 18px; }
  select.copy { font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line);
                background: var(--card); color: var(--text); }
  .editor.off { opacity: .4; pointer-events: none; }
  .warn-note { font-size: 12px; color: var(--warn); margin-bottom: 8px; }

  /* 連投（Threads / X）共通 */
  .ed-text { width: 100%; border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; resize: none;
             padding: 2px 0; outline: none; min-height: 26px; line-height: 1.5; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px 1fr; gap: 10px; }
  .av-col { display: flex; flex-direction: column; align-items: center; }
  .avatar { width: 36px; height: 36px; border-radius: 99px; background: var(--line); flex: none;
            display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .avatar.sm { width: 20px; height: 20px; font-size: 11px; margin-top: 2px; }
  .line { width: 2px; flex: 1; background: var(--line); margin: 4px 0; min-height: 12px; border-radius: 2px; }
  .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; }
  .head .name { font-weight: 700; }
  .head .rm { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  .pg { font-size: 11px; color: var(--muted); background: var(--line); padding: 1px 7px; border-radius: 99px; }
  .foot { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-bottom: 10px; }
  .foot .over { color: var(--danger); font-weight: 700; }
  .add { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; padding: 2px 0; text-align: left; }

  /* Threads 風 */
  .pf-threads .topic-sep { color: var(--muted); }
  .pf-threads .topic { border: 0; background: none; color: var(--text); font: inherit; outline: none; min-width: 0; flex: 1;
                       padding: 0; }
  .pf-threads .topic::placeholder { color: var(--muted); }

  /* X 風 */
  .pf-x .handle { color: var(--muted); }
  .pf-x .add { color: var(--x-blue); font-weight: 600; }
  .ring { width: 20px; height: 20px; border-radius: 99px; flex: none;
          background: conic-gradient(var(--ring, var(--x-blue)) calc(var(--p) * 1%), var(--line) 0);
          -webkit-mask: radial-gradient(circle, transparent 6px, #000 7px); mask: radial-gradient(circle, transparent 6px, #000 7px); }
  .ring.near { --ring: var(--warn); } .ring.full { --ring: var(--danger); }
  .pf-x .row.sep { border-top: 1px solid var(--line); padding-top: 10px; }

  /* ブログ風 */
  .pf-blog { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .pf-blog .b-title { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text);
                      font: inherit; font-size: 20px; font-weight: 700; padding: 4px 0 10px; outline: none; }
  .pf-blog .b-body { width: 100%; border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; line-height: 1.8;
                     min-height: 220px; resize: vertical; outline: none; padding: 12px 0 0; }
  .pf-blog .foot { padding: 6px 0 0; border-top: 1px dashed var(--line); justify-content: space-between; }

  /* ---------- アカウント連携 ---------- */
  .btn.acct { margin-left: auto; background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 6px 12px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px));
           max-height: calc(100vh - 32px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line);
              position: sticky; top: 0; background: var(--card); z-index: 1; }
  .dlg-head h2 { margin: 0; }
  .dlg-body { padding: 12px 16px 16px; display: grid; gap: 12px; }
  .acc { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .acc.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .acc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acc-top .pf { font-weight: 700; font-size: 15px; }
  .acc-state { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .acc-state.on { color: var(--ok); border-color: var(--ok); }
  .acc-actions { margin-left: auto; display: flex; gap: 6px; }
  .acc details { margin-top: 10px; }
  .acc summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .acc .f { display: grid; gap: 4px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .acc .f input, .acc .f textarea { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
                                    color: var(--text); font: inherit; font-size: 13px; width: 100%; }
  .acc .f textarea { min-height: 60px; resize: vertical; }
  .acc a { color: var(--accent); }
  .acc ol { margin: 8px 0 0; padding-left: 20px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .acc code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; word-break: break-all; color: var(--text); }
  .acc .row-btn { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn.login { color: #fff; padding: 8px 14px; }
  .btn.login.x { background: #000; } .btn.login.threads { background: #000; } .btn.login.blog { background: #21759b; }
  .acc .msg { margin-top: 6px; }
  .who { font-size: 12px; color: var(--muted); }
  .who a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* ---------- 予定表 ---------- */
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .cal-head .title { font-weight: 700; font-size: 15px; margin-right: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; color: var(--text); padding: 5px 12px; cursor: pointer; font: inherit; }
  .seg button.active { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .dow.sun { color: var(--danger); } .dow.sat { color: var(--accent); }
  .day { border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-height: 90px; cursor: pointer;
         display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .grid.week .day { min-height: 260px; }
  .day:hover { border-color: var(--accent); }
  .day.other { opacity: .4; }
  .day.past { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--line) 6px 7px); cursor: default; }
  .day.selected { border: 2px solid var(--accent); background: var(--accent-soft); }
  .day .num { font-size: 12px; font-weight: 600; }
  .day.today .num { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; align-self: flex-start; }
  .ev { font-size: 11px; border-radius: 4px; padding: 2px 4px; background: var(--bg); border-left: 3px solid var(--accent);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ev.canceled { text-decoration: line-through; opacity: .5; }
  .ev.failed, .ev.partial { border-left-color: var(--danger); }
  .ev.done { border-left-color: var(--ok); }

  /* ---------- 予約一覧 ---------- */
  .list { margin-top: 16px; }
  .item { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .item .when { font-weight: 600; }
  .item .pf-block { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); }
  .item .pf-name { font-size: 12px; font-weight: 600; }
  .item .body { color: var(--muted); white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .item .body + .body { border-top: 1px dashed var(--line); padding-top: 2px; }
  .item .res { font-size: 12px; margin-top: 4px; word-break: break-all; }
  .item .actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
  .status { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; margin-left: 6px; }
  .st-scheduled { color: var(--accent); } .st-posting { color: var(--warn); } .st-done { color: var(--ok); }
  .st-failed, .st-partial { color: var(--danger); } .st-canceled { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; }
  .item.flash { animation: flash 1.2s; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
</style>
</head>
<body>
<header>
  <h1>📅 自動投稿スケジューラー</h1>
  <div class="badges" id="badges"></div>
  <button class="btn acct" id="openAcct">🔑 アカウント連携</button>
</header>

<dialog id="acctDlg">
  <div class="dlg-head"><h2>🔑 アカウント連携</h2><button class="btn ghost" id="closeAcct">閉じる</button></div>
  <div class="dlg-body" id="acctBody"></div>
</dialog>

<main>
  <!-- 左：投稿フォーム -->
  <section class="card">
    <h2 id="composeTitle">① どこに・何を投稿する？</h2>
    <p class="hint" id="tabHint" style="margin:-6px 0 10px">タブを切り替えて投稿先ごとに内容を作れます（✓ が付いた投稿先に投稿）</p>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>

    <label class="field">② いつ？（予定表で日付をクリック・複数可）</label>
    <div class="chips" id="dateChips"></div>
    <p class="hint" id="dateHint">まだ日付が選ばれていません</p>

    <label class="field" for="time">③ 時間</label>
    <input type="time" id="time" value="09:00" step="300">

    <button class="btn primary" id="submit">予約する</button>
    <div class="msg" id="msg"></div>
  </section>

  <!-- 右：予定表と予約一覧 -->
  <section class="card">
    <div class="cal-head">
      <span class="title" id="calTitle"></span>
      <button class="btn ghost" id="prev">‹</button>
      <button class="btn ghost" id="today">今日</button>
      <button class="btn ghost" id="next">›</button>
      <div class="seg">
        <button data-view="week">1週間</button>
        <button data-view="month">1か月</button>
      </div>
    </div>
    <div class="grid" id="dow"></div>
    <div class="grid" id="grid"></div>

    <div class="list">
      <div class="cal-head">
        <span class="title">予約一覧</span>
        <div class="seg" id="filter">
          <button data-f="scheduled">予約中</button>
          <button data-f="history">履歴</button>
          <button data-f="all">すべて</button>
        </div>
      </div>
      <div id="items"></div>
    </div>
  </section>
</main>

<script>
const ALL_NAMES = { x: "X", threads: "Threads", blog: "ブログ" };
let NAMES = {};  // 使える投稿先（サーバーの ENABLED_PLATFORMS で決まる）
const STATUS = { scheduled: "予約中", posting: "投稿中", done: "投稿済", partial: "一部失敗", failed: "失敗", canceled: "取消" };
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const LIMIT = { x: 280, threads: 500 };

const emptyDrafts = () => ({
  x: { on: false, parts: [""] },
  threads: { on: true, topic: "", parts: [""] },
  blog: { on: false, title: "", body: "" },
});

const state = {
  view: localGet("view") || "week",
  filter: "scheduled",
  cursor: startOfDay(new Date()),
  selected: new Set(),   // "YYYY-MM-DD"
  posts: [],
  status: null,
  tab: localGet("tab") || "threads",
  drafts: loadDrafts(),
};
const $ = (id) => document.getElementById(id);

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function loadDrafts() {
  try { return { ...emptyDrafts(), ...JSON.parse(localGet("drafts") || "{}") }; } catch { return emptyDrafts(); }
}
function saveDrafts() { localSet("drafts", JSON.stringify(state.drafts)); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function hm(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function label(d) { return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// X の重み付き文字数（全角は 2）
function xLength(t) {
  let n = 0;
  for (const ch of t) {
    const cp = ch.codePointAt(0);
    n += (cp <= 0x10ff || (cp >= 0x2000 && cp <= 0x200d) || (cp >= 0x2010 && cp <= 0x201f) || (cp >= 0x2032 && cp <= 0x2037)) ? 1 : 2;
  }
  return n;
}
const lengthOf = (pf, t) => pf === "x" ? xLength(t) : [...t].length;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `エラー (${res.status})`);
  return data;
}

// ---------- 投稿先タブ ----------
function renderTabs() {
  // 投稿先が1つだけならタブと切り替えスイッチは出さない
  const single = Object.keys(NAMES).length === 1;
  $("tabs").hidden = single; $("tabHint").hidden = single;
  $("composeTitle").textContent = single ? `① ${Object.values(NAMES)[0]} に何を投稿する？` : "① どこに・何を投稿する？";
  $("panel").style.borderRadius = single ? "10px" : "";
  $("tabs").innerHTML = Object.entries(NAMES).map(([k, v]) =>
    `<button class="tab ${k === state.tab ? "active" : ""} ${state.drafts[k].on ? "enabled" : ""}" data-tab="${k}">` +
    `<span class="dot ${k}"></span>${v}<span class="on-mark">${state.drafts[k].on ? "✓" : ""}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
    state.tab = b.dataset.tab; localSet("tab", state.tab); renderTabs(); renderPanel();
  }));
}

function renderPanel() {
  if (!NAMES[state.tab]) return;
  const single = Object.keys(NAMES).length === 1;
  const pf = state.tab, d = state.drafts[pf];
  const others = Object.keys(NAMES).filter((k) => k !== pf);
  $("panel").innerHTML = `
    <div class="panel-top" ${single ? "hidden" : ""}>
      <label class="switch"><input type="checkbox" id="pfOn" ${d.on ? "checked" : ""}>${NAMES[pf]} に投稿する</label>
      <select class="copy" id="copyFrom">
        <option value="">他の内容をコピー…</option>
        ${others.map((k) => `<option value="${k}">${NAMES[k]} からコピー</option>`).join("")}
      </select>
    </div>
    ${accountLine(pf)}
    <div class="editor ${d.on ? "" : "off"}" id="editor"></div>`;
  $("pfOn").addEventListener("change", (e) => {
    d.on = e.target.checked; saveDrafts(); renderTabs(); $("editor").classList.toggle("off", !d.on);
  });
  $("copyFrom").addEventListener("change", (e) => { if (e.target.value) copyDraft(e.target.value, pf); });
  pf === "blog" ? renderBlog() : renderThread(pf);
}

function copyDraft(from, to) {
  const src = state.drafts[from], dst = state.drafts[to];
  const text = from === "blog" ? src.body : src.parts.filter((t) => t.trim()).join("\n\n");
  if (to === "blog") {
    dst.body = text;
  } else if (from === "blog") {
    dst.parts = splitText(text, to);
  } else {
    dst.parts = src.parts.flatMap((t) => splitText(t, to));
  }
  dst.on = true;
  saveDrafts(); renderTabs(); renderPanel();
}

// 長い文章を投稿先の文字数上限に収まるよう段落・文単位で分割する
function splitText(text, pf) {
  const units = text.split(/(?<=\n\n)|(?<=[。！？!?])/).filter((u) => u);
  const out = [];
  let cur = "";
  for (const u of units) {
    if (lengthOf(pf, cur + u) <= LIMIT[pf]) { cur += u; continue; }
    if (cur.trim()) out.push(cur.trim());
    cur = u;
    while (lengthOf(pf, cur) > LIMIT[pf]) {  // 1文だけで上限を超える場合は文字単位で切る
      let i = 0, n = 0;
      const chars = [...cur];
      while (i < chars.length && n + lengthOf(pf, chars[i]) <= LIMIT[pf]) n += lengthOf(pf, chars[i++]);
      out.push(chars.slice(0, i).join("").trim());
      cur = chars.slice(i).join("");
    }
  }
  if (cur.trim()) out.push(cur.trim());
  return out.length ? out : [""];
}

// Threads / X：連投（スレッド）エディタ
function renderThread(pf) {
  const d = state.drafts[pf], n = d.parts.length;
  const isX = pf === "x";
  const rows = d.parts.map((t, i) => {
    const head = isX
      ? `<span class="name">${escapeHtml(displayName("x"))}</span>`
      : `<span class="name">${escapeHtml(displayName("threads"))}</span>` + (i === 0
          ? `<span class="topic-sep">›</span><input class="topic" id="topic" maxlength="50" placeholder="トピックを追加" value="${escapeHtml(d.topic)}">`
          : "");
    const ph = i === 0 ? (isX ? "いまどうしてる？" : "今なにしてる？") : (isX ? "ポストを追加" : "スレッドに追加");
    return `<div class="row ${isX && i > 0 ? "sep" : ""}" data-i="${i}">
      <div class="av-col"><div class="avatar">👤</div><div class="line"></div></div>
      <div>
        <div class="head">${head}${n > 1 ? `<span class="pg">${i + 1} / ${n}</span>` : ""}
          ${n > 1 ? `<button class="rm" data-rm="${i}" aria-label="削除">×</button>` : ""}</div>
        <textarea class="ed-text" rows="1" placeholder="${ph}">${escapeHtml(t)}</textarea>
        <div class="foot" data-foot="${i}"></div>
      </div>
    </div>`;
  }).join("");
  $("editor").innerHTML = `<div class="pf-${pf}">${rows}
    <div class="row"><div class="av-col"><div class="avatar sm">👤</div></div>
      <button class="add" id="addPart">${isX ? "＋ ポストを追加" : "スレッドに追加"}</button></div></div>`;

  $("editor").querySelectorAll(".ed-text").forEach((ta) => {
    const i = +ta.closest(".row").dataset.i;
    autoGrow(ta); updateFoot(pf, i);
    ta.addEventListener("input", () => { d.parts[i] = ta.value; autoGrow(ta); updateFoot(pf, i); saveDrafts(); });
  });
  $("editor").querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => {
    d.parts.splice(+b.dataset.rm, 1); saveDrafts(); renderThread(pf);
  }));
  $("topic")?.addEventListener("input", (e) => { d.topic = e.target.value.replace(/[.&]/g, ""); e.target.value = d.topic; saveDrafts(); });
  $("addPart").addEventListener("click", () => {
    d.parts.push(""); saveDrafts(); renderThread(pf);
    const tas = $("editor").querySelectorAll(".ed-text"); tas[tas.length - 1].focus();
  });
}

function updateFoot(pf, i) {
  const t = state.drafts[pf].parts[i], n = lengthOf(pf, t), max = LIMIT[pf];
  const foot = $("editor").querySelector(`[data-foot="${i}"]`);
  if (pf === "x") {
    const left = max - n;
    const cls = left < 0 ? "full" : left <= 20 ? "near" : "";
    foot.innerHTML = `${left <= 20 ? `<span class="${left < 0 ? "over" : ""}">${left}</span>` : ""}` +
      `<span class="ring ${cls}" style="--p:${Math.min(100, n / max * 100)}" title="${n}/${max}（全角は2）"></span>`;
  } else {
    foot.innerHTML = n ? `<span class="${n > max ? "over" : ""}">${n} / ${max}</span>` : "";
  }
}

function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

// ブログ：記事エディタ
function renderBlog() {

function renderAccounts(focus) {
  $("acctBody").innerHTML = `<p class="hint" style="margin:0">ここでログインしたアカウントに投稿します。ログイン情報はこの PC の <code>data/accounts.json</code> にだけ保存されます。</p>` +
    Object.keys(NAMES).map(accountCard).join("");
  if (focus) {
    const el = $("acc-" + focus);
    el.classList.add("focus"); el.scrollIntoView({ block: "nearest" });
  }
  const accMsg = (pf, text, ok) => { const m = $("accMsg-" + pf); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); };
  const run = async (pf, btn, fn, okText) => {
    btn.disabled = true;
    try { await fn(); await loadAccounts(); renderAccounts(pf); accMsg(pf, okText, true); }
    catch (e) { accMsg(pf, e.message, false); btn.disabled = false; }
  };
  const post = (path, body = {}) => api(path, { method: "POST", body: JSON.stringify(body) });

  $("acctBody").querySelectorAll("[data-login]").forEach((b) => b.addEventListener("click", async () => {
    const pf = b.dataset.login;
    try { location.href = (await post(`/api/accounts/${pf}/login`)).url; } catch (e) { accMsg(pf, e.message, false); }
  }));
  $("acctBody").querySelectorAll("[data-disc]").forEach((b) => b.addEventListener("click", () => {
    const pf = b.dataset.disc;
    if (confirm(`${NAMES[pf]} からログアウトしますか？`)) run(pf, b, () => post(`/api/accounts/${pf}/disconnect`), "ログアウトしました");
  }));
  $("acctBody").querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => {
    const pf = b.dataset.save, a = state.accounts[pf];
    const body = pf === "x"
      ? { client_id: $("xId").value, client_secret: $("xSecret").value }
      : { app_id: $("thId").value, app_secret: $("thSecret").value };
    // Secret が空欄で保存済みの場合は Secret を変えない
    if (a.app_ready && !(body.client_secret || body.app_secret)) {
      return accMsg(pf, "Secret も入力してください（変更しない場合は保存不要です）", false);
    }
    run(pf, b, () => post(`/api/accounts/${pf}/app`, body), pf === "x" ? "保存しました。ログインボタンを押してください" : "保存しました");
  }));
  $("acctBody").querySelector("[data-token]")?.addEventListener("click", (e) =>
    run("threads", e.target, () => post("/api/accounts/threads/token", { token: $("thToken").value }), "接続しました"));
  $("acctBody").querySelector("[data-wp]")?.addEventListener("click", (e) =>
    run("blog", e.target, () => post("/api/accounts/blog/connect",
      { url: $("wpUrl").value, user: $("wpUser").value, app_password: $("wpPass").value }), "接続しました"));
}

function openAccounts(focus) {
  if (!state.accounts) return;
  renderAccounts(focus);
  if (!$("acctDlg").open) $("acctDlg").showModal();
}

async function loadAccounts() {
  state.accounts = await api("/api/accounts");

}

// ---------- 予約 ----------
function renderChips() {
  const days = [...state.selected].sort();
  $("dateChips").innerHTML = days.map((s) =>
    `<span class="chip">${label(new Date(s + "T00:00"))}<button data-d="${s}" aria-label="外す">×</button></span>`).join("");
  $("dateHint").hidden = days.length > 0;
  $("dateChips").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { state.selected.delete(b.dataset.d); renderChips(); renderCalendar(); }));
}

function showMsg(text, ok) { $("msg").textContent = text; $("msg").className = "msg " + (ok ? "ok" : "err"); }

async function submit() {
  const time = $("time").value;
  const times = [...state.selected].sort().map((s) => new Date(`${s}T${time}`));
  if (times.some((d) => d < new Date())) return showMsg("過去の日時は予約できません", false);
  const d = state.drafts;
  const targets = Object.keys(NAMES).filter((k) => d[k].on);
  $("submit").disabled = true;
  try {
    const created = await api("/api/posts", {
      method: "POST",
      body: JSON.stringify({
        platforms: targets,
        scheduled_at: times.map((t) => t.toISOString()),
        x: { parts: d.x.parts },
        threads: { topic: d.threads.topic, parts: d.threads.parts },
        blog: { title: d.blog.title, body: d.blog.body },
      }),
    });
    showMsg(`${created.length}件 予約しました（${targets.map((k) => NAMES[k]).join("・")}）`, true);
    const fresh = emptyDrafts();
    for (const k of Object.keys(fresh)) fresh[k].on = d[k].on;  // 投稿先の選択は引き継ぐ
    state.drafts = fresh; saveDrafts();
    state.selected.clear();
    renderChips(); renderTabs(); renderPanel();
    await loadPosts();
  } catch (e) {
    showMsg(e.message, false);
  } finally {
    $("submit").disabled = false;
  }
}

// ---------- 予定表 ----------
function rangeStart() {
  if (state.view === "week") return addDays(state.cursor, -state.cursor.getDay());
  const first = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), 1);
  return addDays(first, -first.getDay());
}

function renderCalendar() {
  document.querySelectorAll(".seg [data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view));
  const start = rangeStart();
  const days = state.view === "week" ? 7 : 42;
  const today = startOfDay(new Date());
  const month = state.cursor.getMonth();

  $("calTitle").textContent = state.view === "week"
    ? `${label(start)} 〜 ${label(addDays(start, 6))}`
    : `${state.cursor.getFullYear()}年 ${month + 1}月`;
  $("dow").innerHTML = DOW.map((d, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("");
  $("grid").className = "grid " + state.view;

  const byDay = {};
  for (const p of state.posts) (byDay[ymd(new Date(p.scheduled_at))] ||= []).push(p);

  let html = "";
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i), key = ymd(d);
    const cls = ["day"];
    if (d < today) cls.push("past");
    if (+d === +today) cls.push("today");
    if (state.view === "month" && d.getMonth() !== month) cls.push("other");
    if (state.selected.has(key)) cls.push("selected");
    const evs = (byDay[key] || []).sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at)).map((p) =>
      `<div class="ev ${p.status}" data-id="${p.id}" title="${escapeHtml(p.content)}">${hm(new Date(p.scheduled_at))} ` +
      p.platforms.map((k) => `<span class="dot ${k}"></span>`).join("") + ` ${escapeHtml(p.content.slice(0, 30))}</div>`).join("");
    html += `<div class="${cls.join(" ")}" data-d="${key}"><span class="num">${state.view === "week" ? `${d.getMonth() + 1}/${d.getDate()}` : d.getDate()}</span>${evs}</div>`;
  }
  $("grid").innerHTML = html;

  $("grid").querySelectorAll(".day").forEach((el) => el.addEventListener("click", (e) => {
    const ev = e.target.closest(".ev");
    if (ev) return focusItem(ev.dataset.id);
    if (el.classList.contains("past")) return;
    const k = el.dataset.d;
    state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
    renderChips(); renderCalendar();
  }));
}

function focusItem(id) {
  const p = state.posts.find((x) => x.id === id);
  if (p && state.filter !== "all" && (p.status === "scheduled") !== (state.filter === "scheduled")) {
    state.filter = "all"; renderList();
  }
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

// ---------- 予約一覧 ----------
function pfBlock(p, k) {
  const b = (p.bodies || {})[k];
  let body;
  if (!b) body = `<div class="body">${escapeHtml(p.content)}</div>`;  // 旧形式の予約
  else if (k === "blog") body = `<div class="body"><b>${escapeHtml(b.title || "（タイトルなし）")}</b></div><div class="body">${escapeHtml(b.body.slice(0, 120))}${b.body.length > 120 ? "…" : ""}</div>`;
  else body = b.parts.map((t, i) => `<div class="body">${b.parts.length > 1 ? `<span class="pg">${i + 1}/${b.parts.length}</span> ` : ""}${escapeHtml(t)}</div>`).join("");
  const topic = k === "threads" && b?.topic ? ` › ${escapeHtml(b.topic)}` : "";
  const r = (p.results || {})[k];
  const res = r ? `<div class="res" style="color:var(--${r.ok ? "ok" : "danger"})">${r.ok ? "✓" : "✗"} ${escapeHtml(r.info || "")}</div>` : "";
  return `<div class="pf-block"><div class="pf-name"><span class="dot ${k}"></span>${ALL_NAMES[k]}${topic}</div>${body}${res}</div>`;
}

function renderList() {
  document.querySelectorAll("#filter button").forEach((b) => b.classList.toggle("active", b.dataset.f === state.filter));
  let list = state.posts;
  if (state.filter === "scheduled") list = list.filter((p) => p.status === "scheduled" || p.status === "posting");
  if (state.filter === "history") list = list.filter((p) => p.status !== "scheduled" && p.status !== "posting");
  list = [...list].sort((a, b) => state.filter === "scheduled"
    ? a.scheduled_at.localeCompare(b.scheduled_at) : b.scheduled_at.localeCompare(a.scheduled_at));

  if (!list.length) { $("items").innerHTML = `<div class="empty">該当する投稿はありません</div>`; return; }
  $("items").innerHTML = list.map((p) => {
    const d = new Date(p.scheduled_at);
    const actions = p.status === "scheduled"
      ? `<button class="btn ghost" data-act="now">今すぐ投稿</button><button class="btn danger" data-act="cancel">取消</button>`
      : p.status === "posting" ? "" : `<button class="btn ghost" data-act="delete">削除</button>`;
    return `<div class="item" data-id="${p.id}">
      <div>
        <div class="when">${label(d)} ${hm(d)} <span class="status st-${p.status}">${STATUS[p.status]}</span></div>
        ${p.platforms.map((k) => pfBlock(p, k)).join("")}
      </div>
      <div class="actions">${actions}</div>
    </div>`;
  }).join("");

  $("items").querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.closest(".item").dataset.id, act = b.dataset.act;
    const confirmText = { cancel: "この予約を取り消しますか？", now: "今すぐ投稿しますか？", delete: "履歴から削除しますか？" }[act];
    if (!confirm(confirmText)) return;
    try {
      if (act === "delete") await api(`/api/posts/${id}`, { method: "DELETE" });
      else await api(`/api/posts/${id}/${act}`, { method: "POST" });
      await loadPosts();
      if (act === "now") setTimeout(loadPosts, 3000);
    } catch (e) { alert(e.message); }
  }));
}

async function loadPosts() {
  state.posts = await api("/api/posts");
  renderCalendar(); renderList();
}

async function loadStatus() {
  state.status = await api("/api/status");
  const s = state.status;
  NAMES = Object.fromEntries(Object.entries(s.platforms).map(([k, p]) => [k, p.name]));
  if (!NAMES[state.tab]) state.tab = Object.keys(NAMES)[0];
  if (Object.keys(NAMES).length === 1) state.drafts[state.tab].on = true;
  renderTabs();
  $("badges").innerHTML = (s.dry_run ? `<span class="badge test">テストモード（実際には投稿しません）</span>` : "") +
    Object.entries(s.platforms).map(([k, p]) =>
      `<span class="badge ${p.configured ? "on" : ""}" data-acct="${k}" style="cursor:pointer">${p.name}: ${p.configured ? "接続済" : "未ログイン"}</span>`).join("");
  renderPanel();
}

// ---------- イベント ----------
document.querySelectorAll(".seg [data-view]").forEach((b) => b.addEventListener("click", () => {
  state.view = b.dataset.view; localSet("view", state.view); renderCalendar();
}));
document.querySelectorAll("#filter button").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.f; renderList(); }));
$("prev").addEventListener("click", () => {
  state.cursor = state.view === "week" ? addDays(state.cursor, -7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1);
  renderCalendar();
});
$("next").addEventListener("click", () => {
  state.cursor = state.view === "week" ? addDays(state.cursor, 7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1);
  renderCalendar();
});
$("today").addEventListener("click", () => { state.cursor = startOfDay(new Date()); renderCalendar(); });
$("submit").addEventListener("click", submit);

$("openAcct").addEventListener("click", () => openAccounts());
$("closeAcct").addEventListener("click", () => $("acctDlg").close());

renderTabs(); renderPanel(); renderChips(); renderCalendar();
// ログインから戻ってきたとき
const qs = new URLSearchParams(location.search);
const back = qs.get("connected"), authErr = qs.get("auth_error");
if (back || authErr) history.replaceState(null, "", location.pathname);
loadAccounts().then(() => {
  if (back) { openAccounts(back); const m = $("accMsg-" + back); m.textContent = "ログインしました"; m.className = "msg ok"; }
  if (authErr) { openAccounts(); showMsg("ログインに失敗しました：" + authErr, false); alert("ログインに失敗しました\n" + authErr); }
}).catch(() => {});
loadStatus().catch((e) => showMsg("サーバーに接続できません: " + e.message, false));
loadPosts().catch(() => {});
setInterval(() => loadPosts().catch(() => {}), 30000);
</script>
</body>
</html>
