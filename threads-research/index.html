<style>
/* Layout: sticky header + step rail (left on desktop, scrolling strip on phone) + one working sheet per step */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunken: #e9eeec;
  --ink: #15191b;
  --muted: #5b666b;
  --line: #d9dfdd;
  --accent: #0f6b66;
  --accent-ink: #ffffff;
  --accent-soft: #dcedeb;
  --good: #2e7a3a;
  --good-soft: #e0f0e2;
  --warn: #a55f00;
  --warn-soft: #f8ead3;
  --bad: #b3261e;
  --bad-soft: #f8e1df;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111516; --surface: #192022; --sunken: #141a1b; --ink: #e6ecea; --muted: #97a3a6;
    --line: #2b3537; --accent: #4db3aa; --accent-ink: #0c1515; --accent-soft: #1b3331;
    --good: #6cc27a; --good-soft: #1c3121; --warn: #e0a24a; --warn-soft: #382a14;
    --bad: #ef7d74; --bad-soft: #3a1d1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111516; --surface: #192022; --sunken: #141a1b; --ink: #e6ecea; --muted: #97a3a6;
  --line: #2b3537; --accent: #4db3aa; --accent-ink: #0c1515; --accent-soft: #1b3331;
  --good: #6cc27a; --good-soft: #1c3121; --warn: #e0a24a; --warn-soft: #382a14;
  --bad: #ef7d74; --bad-soft: #3a1d1b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.65; margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-inline: 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; font-weight: 900; letter-spacing: .02em; }
.brand small { color: var(--muted); font-size: 12px; }
.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); font-size: 12px; white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 700; }
.chip.on { background: var(--accent-soft); color: var(--accent); }
.save { font-size: 12px; color: var(--muted); }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto; padding-block: 20px 64px; padding-inline: 16px; }
.rail { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
.rail button {
  display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: center; text-align: left;
  background: none; border: 1px solid transparent; border-radius: var(--r); padding: 8px 10px; cursor: pointer;
}
.rail button:hover { background: var(--surface); border-color: var(--line); }
.rail button[aria-current="step"] { background: var(--surface); border-color: var(--accent); }
.rail .no { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; background: var(--sunken); color: var(--muted); }
.rail button[aria-current="step"] .no { background: var(--accent); color: var(--accent-ink); }
.rail .no.done { background: var(--good-soft); color: var(--good); }
.rail .nm { font-weight: 700; font-size: 13px; }
.rail .bar { height: 3px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.rail .bar i { display: block; height: 100%; background: var(--accent); }

.sheet { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.head h2 { font-size: 24px; font-weight: 900; }
.head p { margin: 0; color: var(--muted); max-width: 68ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h3 .tag { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); background: var(--sunken); padding: 1px 8px; border-radius: 4px; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
input[type="text"], input[type="number"], input[type="url"], input[type="date"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0;
}
input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
textarea { resize: vertical; min-height: 64px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 13px; background: var(--bg); }
.checks input { accent-color: var(--accent); margin: 0; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.btn.icon { padding: 3px 8px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > input[type="text"] { flex: 1 1 220px; width: auto; }

.rate { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.rate button { width: 34px; height: 30px; border: 0; border-right: 1px solid var(--line); background: var(--bg); cursor: pointer; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.rate button:last-child { border-right: 0; }
.rate button.on { background: var(--accent); color: var(--accent-ink); }
.rate-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; background: var(--sunken); }
.rate-wrap b { font-size: 13px; }
.rubric { font-size: 12px; color: var(--muted); margin: 0; padding-left: 1.2em; }
.rubric li { margin: 1px 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.edit td { padding: 4px 6px; }
table.edit input, table.edit select { padding: 5px 7px; font-size: 13px; }
table.edit td.w-s input { width: 90px; }
table.edit td.w-m input, table.edit td.w-m select { min-width: 130px; }
table.edit td.w-l input { min-width: 200px; }

.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.none { background: var(--sunken); color: var(--muted); font-weight: 500; }
.ex { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 0 6px; border-radius: 4px; letter-spacing: .04em; }
.scorebar { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--sunken); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.scorebar i { display: block; height: 100%; background: var(--accent); }
tr.picked td { background: var(--accent-soft); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--sunken); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 11.5px; color: var(--muted); }
.stat b { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 500; }
.stat small { color: var(--muted); font-size: 11.5px; }

.counter { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.counter.over { color: var(--bad); font-weight: 700; }
.kw-links { display: flex; flex-wrap: wrap; gap: 6px; }
.kw-links a { font-size: 12.5px; text-decoration: none; border: 1px dashed var(--accent); border-radius: 999px; padding: 2px 10px; }
.kw-links a:hover { background: var(--accent-soft); }
.statement { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.6; padding: 14px 16px; background: var(--accent-soft); border-radius: 6px; margin: 0; }
pre.md { white-space: pre-wrap; word-break: break-word; background: var(--sunken); border-radius: 6px; padding: 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; max-height: 520px; overflow: auto; margin: 0; }
.chart svg { width: 100%; height: auto; display: block; }
.empty { color: var(--muted); font-size: 13px; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 20; }
.nextbar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .rail button { grid-template-columns: 22px auto; padding: 6px 10px; border-color: var(--line); background: var(--surface); flex: 0 0 auto; }
  .rail .no { width: 22px; height: 22px; font-size: 11px; }
  .rail .bar { display: none; }
  .head h2 { font-size: 20px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  function emptyState() {
    const g = blankGenre("新しいジャンル");

      v: 1, step: 1, openGenre: g.id, selectedGenre: null, sample: false,
      weights: { vol: 30, mon: 40, con: 30 }, genres: [g], competitors: [],
      persona: { age: "", attr: "", pains: "", ideal: "", habits: "", wants: "", trigger: "" },

  }

  let S;
  let storageOk = true;

  let saveTimer = null;
  function save() {

  }

  // ---------- helpers ----------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fid = (p) => "f-" + p.replace(/\./g, "-");
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const fmt = (v, d = 0) => (num(v) == null ? "—" : v.toLocaleString("ja-JP", { maximumFractionDigits: d, minimumFractionDigits: d }));
  function getPath(p) { return p.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S); }
  function setPath(p, val) {
    const ks = p.split("."); let o = S;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }
  const median = (arr) => { const a = arr.filter((x) => num(x) != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const avg = (arr) => { const a = arr.filter((x) => num(x) != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
  const filled = (v) => v != null && String(v).trim() !== "";

  function total(g) {
    const w = S.weights, sum = (w.vol || 0) + (w.mon || 0) + (w.con || 0);
    if (g.vol.score == null || g.mon.score == null || g.con.score == null || !sum) return null;
    return (g.vol.score * (w.vol || 0) + g.mon.score * (w.mon || 0) + g.con.score * (w.con || 0)) / sum;

  const target = () => genreById(S.selectedGenre);
  function typeStats(posts) {

  }

  // ---------- progress ----------
  function progress(id) {
    const ratio = (vals) => vals.filter(filled).length / vals.length;
    switch (id) {
      case 1: { const done = S.genres.filter((g) => total(g) != null).length; return Math.min(1, (done / Math.max(2, S.genres.length)) * 0.8 + (S.selectedGenre ? 0.2 : 0)); }
      case 2: return Math.min(1, S.competitors.filter((c) => filled(c.name)).length / 5);
      case 3: return ratio(Object.values(S.persona));
      case 4: return ratio(Object.values(S.position));
      case 5: return Math.min(1, (filled(S.plan.freq) ? 0.2 : 0) + (filled(S.plan.cta) ? 0.2 : 0) + Math.min(0.6, S.plan.ideas.length / 10 * 0.6));
      case 6: return Math.min(1, (filled(S.kpi.d30) ? 0.4 : 0) + Math.min(0.6, S.kpi.logs.length / 4 * 0.6));

    }
  }

  // ---------- chrome ----------
  function renderRail() {

  function calcStep1() {

    <section class="panel">

        <tbody>${S.competitors.length ? S.competitors.map((c, i) => `<tr>

  }
  const er = (c) => (num(c.likes) != null && num(c.followers) ? (c.likes / c.followers) * 100 : null);
  function calcStep2() {
    document.querySelectorAll('[data-calc="er"]').forEach((el) => {
      const v = er(S.competitors[+el.dataset.i] || {});
      el.innerHTML = v == null ? "—" : `${v.toFixed(1)}%`;

  function calcStep6() {

    const logs = S.kpi.logs.map((l, i) => ({ i, d: l.date, f: num(l.followers) })).filter((x) => x.f != null);
    if (logs.length < 2) { el.innerHTML = '<p class="note">2 週分の記録がたまると、フォロワー推移のグラフが出ます。</p>'; return; }
    const W = 640, H = 220, L = 52, R = 70, T = 16, B = 30;
    const goal = num(S.kpi.d30);
    const maxY = Math.max(...logs.map((x) => x.f), goal || 0) * 1.1 || 1;
    const nice = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
    const step = nice(maxY / 4), top = Math.ceil(maxY / step) * step;
    const x = (k) => L + (k / (logs.length - 1)) * (W - L - R), y = (v) => T + (1 - v / top) * (H - T - B);
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-mono)">${v.toLocaleString("ja-JP")}</text>`;

    if (el.dataset.bind) {
      let v = el.value;
      if ("num" in el.dataset) v = v === "" ? null : Number(v);
      setPath(el.dataset.bind, v);
      if (el.dataset.bind.endsWith(".name") && S.step === 1) {
        const tab = document.querySelector('.tabs [aria-selected="true"]');
        if (tab) tab.firstChild.textContent = v;
      }
      save(); refresh();
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.arr) {
      const arr = (getPath(el.dataset.arr) || []).slice();
      const i = arr.indexOf(el.value);
      if (el.checked && i < 0) arr.push(el.value); else if (!el.checked && i >= 0) arr.splice(i, 1);
      setPath(el.dataset.arr, arr); save(); refresh();
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.dataset.form === "addGenre") {
      e.preventDefault();
      const box = document.getElementById("new-genre"), name = box.value.trim();
      if (!name) { box.focus(); return; }
      const g = blankGenre(name); S.genres.push(g); S.openGenre = g.id; save(); render();
    }
  });
  let resetArmed = null;
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, v = b.dataset.v;
    if (act === "step") { S.step = +v; save(); render(); window.scrollTo({ top: 0 }); }
    else if (act === "openGenre") { S.openGenre = v; save(); render(); }
    else if (act === "pickGenre") { S.selectedGenre = v; save(); refresh(); toast(`「${genreById(v).name}」を対象ジャンルにしました`); }
    else if (act === "delGenre") {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "もう一度押すと削除"; return; }
      S.genres = S.genres.filter((g) => g.id !== v);
      if (S.selectedGenre === v) S.selectedGenre = null;
      if (!S.genres.length) S.genres.push(blankGenre());
      S.openGenre = S.genres[0].id; save(); render();
    }
    else if (act === "rate") {
      const p = b.dataset.path, n = +v, cur = getPath(p);
      setPath(p, cur === n ? null : n);
      b.parentElement.querySelectorAll("button").forEach((x) => { const on = +x.dataset.v === getPath(p); x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
      save(); refresh();
    }
    else if (act === "addRow") { getPath(b.dataset.path).push(NEW_ROW[v]()); save(); render(); }
    else if (act === "delRow") { getPath(b.dataset.path).splice(+v, 1); save(); render(); }
    else if (act === "copyReport") copy(report(), "レポートをコピーしました");
    else if (act === "copyJson") copy(JSON.stringify(S), "バックアップをコピーしました");
    else if (act === "importJson") {
      const msg = document.getElementById("import-msg");
      try {
        const d = JSON.parse(document.getElementById("import-box").value);
        if (!d || !Array.isArray(d.genres) || !d.kpi || !d.plan) throw new Error("shape");
        S = d; S.step = 7; save(); render(); toast("バックアップから復元しました");
      } catch (err) { msg.textContent = "読み込めませんでした。「バックアップをコピー」で取った JSON をそのまま貼り付けてください。"; }
    }
    else if (act === "reset") {
      if (resetArmed !== v) { resetArmed = v; b.textContent = "もう一度押すと実行"; return; }
      resetArmed = null; S = v === "sample" ? sampleState() : emptyState(); save(); render(); toast(v === "sample" ? "記入例を読み込みました" : "白紙にしました。Step 1 から始めましょう");
    }
  });

  if (!storageOk) document.getElementById("save-state").textContent = "このブラウザでは自動保存できません";
  render();
})();
</script>
